function visible(d){return(selectedCountry==='All countries'||d.country===selectedCountry)&&(active==='All'||d.cat===active)&&(!query||`${d.name} ${d.city} ${d.cat}`.toLowerCase().includes(query.toLowerCase()))}
function updateOfflinePins(){const host=document.getElementById('offlinePins');if(!host)return;host.innerHTML=data.filter(visible).map(d=>`<button class="fallback-pin ${selected===d.id?'picked':''}" data-id="${d.id}" style="left:${(d.lng-20)/60*100}%;top:${(70-d.lat)/40*100}%;--pin:${colors[d.cat]}" title="${d.name}">${categorySymbols[d.cat]}</button>`).join('');host.querySelectorAll('.fallback-pin').forEach(el=>el.onclick=()=>select(Number(el.dataset.id),false))}
function render(){const shown=data.filter(visible);document.getElementById('count').textContent=String(shown.length).padStart(2,'0')+' PLACES';const container=document.getElementById('places');container.innerHTML='';shown.forEach(d=>{const el=document.createElement('article');el.className='place'+(selected===d.id?' selected':'');el.innerHTML=`<div class="thumb" style="--tone:${d.tone}">${categorySymbols[d.cat]}</div><div><h3>${d.name}</h3><div class="meta">${d.city}</div><div class="cat">${d.cat} · ${d.year}</div><a class="source-link" href="${d.source}" target="_blank" rel="noopener">Source: ${d.sourceLabel} ↗</a></div><div class="arrow">↗</div>`;el.onclick=e=>{if(e.target.closest('a'))return;select(d.id,true)};container.appendChild(el)});if(!shown.length)container.innerHTML='<div class="empty">No matching places found.</div>';data.forEach(d=>{const icon=markers[d.id];const node=icon.getElement();if(node)node.style.display=visible(d)?'':'none'});if(offlineMap)updateOfflinePins()}
function select(id,fly){selected=id;render();const d=data.find(x=>x.id===id);if(fly&&!offlineMap){map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),7),{duration:.7});markers[id].openPopup()}}
function focusCountry(){if(offlineMap)return;const matches=data.filter(visible);if(selectedCountry==='All countries'){map.flyTo([48.4,47.4],4);return}if(matches.length===1){map.flyTo([matches[0].lat,matches[0].lng],7);return}if(matches.length>1)map.fitBounds(L.latLngBounds(matches.map(d=>[d.lat,d.lng])),{padding:[70,70],maxZoom:7})}
countrySelect.onchange=()=>{selectedCountry=countrySelect.value;selected=null;render();focusCountry()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});render();
}
</script>
<script>
(function(){const select=document.getElementById('countrySelect'),host=document.getElementById('countryButtons');if(!select||!host)return;const flags={'All countries':'🌐','Armenia':'🇦🇲','Armenia':'🇦🇲','Azerbaijan':'🇦🇿','Azerbaijan':'🇦🇿','Belarus':'🇧🇾','Estonia':'🇪🇪','Estonia':'🇪🇪','Georgia':'🇬🇪','Georgia':'🇬🇪','Kazakhstan':'🇰🇿','Kazakhstan':'🇰🇿','Kyrgyzstan':'🇰🇬','Kyrgyzstan':'🇰🇬','Latvia':'🇱🇻','Latvia':'🇱🇻','Lithuania':'🇱🇹','Lithuania':'🇱🇹','Moldova':'🇲🇩','Moldova':'🇲🇩','Russia':'🇷🇺','Russia':'🇷🇺','Tajikistan':'🇹🇯','Tajikistan':'🇹🇯','Turkmenistan':'🇹🇲','Ukraine':'🇺🇦','Uzbekistan':'🇺🇿','Uzbekistan':'🇺🇿'};function draw(){host.replaceChildren();Array.from(select.options).forEach(option=>{const button=document.createElement('button');button.type='button';button.className='country-button'+(select.value===option.value?' active':'');button.setAttribute('aria-pressed',String(select.value===option.value));const flag=document.createElement('span');flag.className='country-flag';flag.setAttribute('aria-hidden','true');flag.textContent=flags[option.value]||'🏳️';button.append(flag,document.createTextNode(option.textContent));button.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change'));draw()};host.appendChild(button)})}select.addEventListener('change',draw);draw()})();
</script>
</body></html>
