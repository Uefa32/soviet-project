const cats=['All','Lost Places','Monuments','Brutalism','Mosaics'];const colors={'Lost Places':'#69766e','Monuments':'#687580','Brutalism':'#a37a51','Mosaics':'#ba4937'};const categorySymbols={'Lost Places':'⌂','Monuments':'⚑','Brutalism':'▦','Mosaics':'✳'};function categoryIcon(cat){const files={'Lost Places':'lost-places','Monuments':'monuments','Brutalism':'brutalism','Mosaics':'mosaics'};return `<img class="category-icon" src="assets/${files[cat]}.png" alt="" aria-hidden="true" loading="eager">`;}function visitedControl(id){return `<button class="visit-toggle ${visited.has(id)?'visited':''}" aria-label="${visited.has(id)?'Unmark visited':'Mark as visited'}" aria-pressed="${visited.has(id)}" title="Visited" onclick="event.stopPropagation();toggleVisited(${id})"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.2 3 3 6-6"/></svg><span>Visited</span></button>`;}function popupHTML(d){return `<div class="popcat">${d.cat} · ${d.year}</div><div class="poptitle">${d.name}</div><div class="popmeta">${d.city}</div><div class="popdesc">${d.desc}</div>${visitedControl(d.id)}<a class="source-link popsource" href="${d.source}" target="_blank" rel="noopener">Source: ${d.sourceLabel} ↗</a>`;}let active='All',query='',selected=null,selectedCountry='All countries',showVisitedOnly=false;const visitedKey='soviet-project-visited';let visited=new Set();try{visited=new Set(JSON.parse(localStorage.getItem(visitedKey)||'[]').map(Number))}catch(e){}function toggleVisited(id){if(visited.has(id))visited.delete(id);else visited.add(id);try{localStorage.setItem(visitedKey,JSON.stringify([...visited]))}catch(e){}if(window.syncVisitedButton)window.syncVisitedButton();if(window.refreshVisitedUI)window.refreshVisitedUI()}function addVisitedFilter(host){const b=document.createElement('button');b.type='button';b.className='filter visited-filter';b.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.2 3 3 6-6"/></svg>Visited';b.setAttribute('aria-pressed','false');b.onclick=()=>{showVisitedOnly=!showVisitedOnly;b.classList.toggle('active',showVisitedOnly);b.setAttribute('aria-pressed',String(showVisitedOnly));if(window.refreshVisitedUI)window.refreshVisitedUI()};host.appendChild(b);window.syncVisitedButton=()=>{b.classList.toggle('active',showVisitedOnly);b.setAttribute('aria-pressed',String(showVisitedOnly))}}const countrySelect=document.getElementById('countrySelect');[...new Set(data.map(d=>d.country))].sort((a,b)=>a.localeCompare(b,'de')).forEach(country=>{const option=document.createElement('option');option.value=country;option.textContent=country;countrySelect.appendChild(option)});
if(!window.L){
  const mapEl=document.getElementById('map');
  mapEl.innerHTML='<div class="fallback-grid"></div><div class="fallback-label">EURASIA</div><div id="fallbackPins"></div><div class="fallback-credit">Offline map view · places are shown schematically</div>';
  const filtersEl=document.getElementById('filters');
  cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.innerHTML=c==='All'?'All':`<i class="dot" style="--c:${colors[c]}"></i><span class="catsymbol" style="--c:${colors[c]}">${categoryIcon(c)}</span>${c}`;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));fallbackRender()};filtersEl.appendChild(b)});addVisitedFilter(filtersEl);
  const leg=document.getElementById('legend');cats.slice(1).forEach(c=>{const s=document.createElement('span');s.innerHTML=`${categoryIcon(c)}${c}`;leg.appendChild(s)});
  function fallbackVisible(d){return(selectedCountry==='All countries'||d.country===selectedCountry)&&(active==='All'||d.cat===active)&&(!showVisitedOnly||visited.has(d.id))&&(!query||`${d.name} ${d.city} ${d.cat}`.toLowerCase().includes(query.toLowerCase()))}
  function fallbackRender(){const shown=data.filter(fallbackVisible);document.getElementById('count').textContent=String(shown.length).padStart(2,'0')+' PLACES';document.getElementById('places').innerHTML=shown.length?shown.map(d=>`<article class="place ${selected===d.id?'selected':''}" data-id="${d.id}"><div class="thumb" style="--tone:${d.tone}">${categoryIcon(d.cat)}</div><div><h3>${d.name}</h3><div class="meta">${d.city}</div><div class="cat">${d.cat} · ${d.year}</div>${visitedControl(d.id)}<a class="source-link" href="${d.source}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Source: ${d.sourceLabel} ↗</a></div><div class="arrow">↗</div></article>`).join(''):'<div class="empty">No matching places found.</div>';document.getElementById('fallbackPins').innerHTML=shown.map(d=>`<button class="fallback-pin ${selected===d.id?'picked':''}" data-id="${d.id}" style="left:${(d.lng-20)/60*100}%;top:${(70-d.lat)/40*100}%;--pin:${colors[d.cat]}" title="${d.name}">${categoryIcon(d.cat)}</button>`).join('');document.querySelectorAll('.place,.fallback-pin').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.id);fallbackRender()})}
  countrySelect.onchange=()=>{selectedCountry=countrySelect.value;fallbackRender()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;fallbackRender()});window.refreshVisitedUI=fallbackRender;fallbackRender();
} else {
let offlineMap=false,tileErrors=0;const map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([48.4,47.4],4);let tiles;L.control.zoom({position:'bottomright'}).addTo(map);
function showOfflineMap(){if(offlineMap)return;offlineMap=true;const layer=document.createElement('div');layer.className='offline-overlay';layer.innerHTML='<div class="fallback-grid"></div><div class="fallback-label">EURASIA</div><div id="offlinePins"></div><div class="fallback-credit">External map tiles blocked · schematic view</div>';document.getElementById('map').appendChild(layer);if(tiles)tiles.off('tileerror');updateOfflinePins();}
const tileSelect=document.getElementById('tileSelect');const savedTile=localStorage.getItem('sovietProject.tile');tileSelect.value=(savedTile==='osmde'||savedTile==='esriimage')?savedTile:'osmde';
function tileTemplate(){if(tileSelect.value==='esriimage')return ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Imagery © Esri, Maxar, Earthstar Geographics'];return ['https://tile.openstreetmap.de/{z}/{x}/{y}.png','© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'];}
function applyTiles(){const config=tileTemplate();if(tiles){tiles.off('tileerror');map.removeLayer(tiles)}const old=document.querySelector('.offline-overlay');if(old)old.remove();offlineMap=false;tileErrors=0;localStorage.setItem('sovietProject.tile',tileSelect.value);tiles=L.tileLayer(config[0],{maxZoom:19,attribution:config[1],errorTileUrl:''}).addTo(map);tiles.on('tileerror',()=>{if(++tileErrors>=3)showOfflineMap()});}
tileSelect.onchange=applyTiles;applyTiles();
const markers={}; data.forEach(d=>{const icon=L.divIcon({className:'',html:`<div class="marker" style="background:${colors[d.cat]};border-color:#fff;color:${colors[d.cat]}"><span style="color:white;position:relative;z-index:1">${categoryIcon(d.cat)}</span></div>`,iconSize:[29,29],iconAnchor:[14,14]});const m=L.marker([d.lat,d.lng],{icon}).addTo(map).bindPopup(popupHTML(d));m.on('click',()=>select(d.id,false));markers[d.id]=m;});
const filters=document.getElementById('filters');cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.innerHTML=c==='All'?'All':`<i class="dot" style="--c:${colors[c]}"></i><span class="catsymbol" style="--c:${colors[c]}">${categoryIcon(c)}</span>${c}`;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};filters.appendChild(b)});addVisitedFilter(filters);
const legend=document.getElementById('legend');cats.slice(1).forEach(c=>{const s=document.createElement('span');s.innerHTML=`${categoryIcon(c)}${c}`;legend.appendChild(s)});
function visible(d){return(selectedCountry==='All countries'||d.country===selectedCountry)&&(active==='All'||d.cat===active)&&(!showVisitedOnly||visited.has(d.id))&&(!query||`${d.name} ${d.city} ${d.cat}`.toLowerCase().includes(query.toLowerCase()))}
function updateOfflinePins(){const host=document.getElementById('offlinePins');if(!host)return;host.innerHTML=data.filter(visible).map(d=>`<button class="fallback-pin ${selected===d.id?'picked':''}" data-id="${d.id}" style="left:${(d.lng-20)/60*100}%;top:${(70-d.lat)/40*100}%;--pin:${colors[d.cat]}" title="${d.name}">${categoryIcon(d.cat)}</button>`).join('');host.querySelectorAll('.fallback-pin').forEach(el=>el.onclick=()=>select(Number(el.dataset.id),false))}
function render(){const shown=data.filter(visible);document.getElementById('count').textContent=String(shown.length).padStart(2,'0')+' PLACES';const container=document.getElementById('places');container.innerHTML='';shown.forEach(d=>{const el=document.createElement('article');el.className='place'+(selected===d.id?' selected':'');el.innerHTML=`<div class="thumb" style="--tone:${d.tone}">${categoryIcon(d.cat)}</div><div><h3>${d.name}</h3><div class="meta">${d.city}</div><div class="cat">${d.cat} · ${d.year}</div>${visitedControl(d.id)}<a class="source-link" href="${d.source}" target="_blank" rel="noopener">Source: ${d.sourceLabel} ↗</a></div><div class="arrow">↗</div>`;el.onclick=e=>{if(e.target.closest('a'))return;select(d.id,true)};container.appendChild(el)});if(!shown.length)container.innerHTML='<div class="empty">No matching places found.</div>';data.forEach(d=>{const icon=markers[d.id];const node=icon.getElement();if(node){node.style.display=visible(d)?'':'none';node.querySelector('.marker')?.classList.toggle('visited',visited.has(d.id))}if(icon.isPopupOpen())icon.setPopupContent(popupHTML(d))});if(offlineMap)updateOfflinePins()}
window.refreshVisitedUI=render;
function select(id,fly){selected=id;render();const d=data.find(x=>x.id===id);if(fly&&!offlineMap){map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),7),{duration:.7});markers[id].openPopup()}}
function focusCountry(){if(offlineMap)return;const matches=data.filter(visible);if(selectedCountry==='All countries'){map.flyTo([48.4,47.4],4);return}if(matches.length===1){map.flyTo([matches[0].lat,matches[0].lng],7);return}if(matches.length>1)map.fitBounds(L.latLngBounds(matches.map(d=>[d.lat,d.lng])),{padding:[70,70],maxZoom:7})}
countrySelect.onchange=()=>{selectedCountry=countrySelect.value;selected=null;render();focusCountry()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});render();
}
</script>
<script>
(function(){const select=document.getElementById('countrySelect'),host=document.getElementById('countryButtons');if(!select||!host)return;const slugs={'All countries':'all','Armenia':'armenia','Azerbaijan':'azerbaijan','Belarus':'belarus','Estonia':'estonia','Georgia':'georgia','Kazakhstan':'kazakhstan','Kyrgyzstan':'kyrgyzstan','Latvia':'latvia','Lithuania':'lithuania','Moldova':'moldova','Russia':'russia','Tajikistan':'tajikistan','Turkmenistan':'turkmenistan','Ukraine':'ukraine','Uzbekistan':'uzbekistan'};function draw(){host.replaceChildren();Array.from(select.options).forEach(option=>{const button=document.createElement('button');button.type='button';button.className='country-button'+(select.value===option.value?' active':'');button.setAttribute('aria-pressed',String(select.value===option.value));const flag=document.createElement('img');flag.className='country-flag-img';flag.src=`assets/flags/${slugs[option.value]||'all'}.svg`;flag.alt='';flag.setAttribute('aria-hidden','true');const name=document.createElement('span');name.className='country-name';name.textContent=option.textContent;button.append(flag,name);button.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change'));draw()};host.appendChild(button)})}select.addEventListener('change',draw);draw()})();
</script>
