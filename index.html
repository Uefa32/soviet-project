,{id:335,name:"House of Political Education (Vytautas Magnus University Central Building)",city:"Kaunas, Lithuania",country:"Lithuania",cat:"Brutalism",lat:54.8987,lng:23.9159,year:"1974",tone:"#a37a51",symbol:"▦",desc:"Boleslovas Zabulionis’ former political education complex, composed of interlocking concrete volumes around a major public square.",source:"https://autc.lt/architekturos-objektas/?id=570",sourceLabel:"Architecture and Urbanism Research Centre"}
,{id:336,name:"Seimas Palace (Former Supreme Soviet Building)",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Brutalism",lat:54.6872,lng:25.2752,year:"1976–1982",tone:"#a37a51",symbol:"▦",desc:"The former Supreme Council of the Lithuanian SSR, designed by Algimantas and Vytautas Nasvytis; the heritage-listed complex includes Independence Square.",source:"https://www.lrs.lt/sip/portal.show?p_k=2&p_r=39108",sourceLabel:"Seimas of the Republic of Lithuania"}
,{id:337,name:"Ziemupe No. 158 Zenith Missile Base",city:"Ziemupe, Latvia",country:"Latvia",cat:"Lost Places",lat:56.90583,lng:22.23611,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"Abandoned Soviet air-defence site with surviving structures and missile silos. The heritage guide warns that the degraded grounds can be dangerous; observe from public roads only.",source:"https://www.celotajs.lv/en/e/ziemuperakesubaze",sourceLabel:"Lauku Ceļotājs · Military Heritage Latvia"}
,{id:338,name:"Former Soviet Border Guard Observation Tower, Pāvilosta",city:"Pāvilosta, Latvia",country:"Latvia",cat:"Monuments",lat:56.8898,lng:21.16829,year:"Soviet era",tone:"#687580",symbol:"⚑",desc:"Former border-guard lookout tower by the South Pier, restored as a public observation platform; the heritage guide records its Soviet-era use and present location.",source:"https://www.celotajs.lv/g/Publ/2022/Military_Heritage_Guidebook/Military_Heritage_Guidebook_en.pdf",sourceLabel:"Military Heritage Tourism · Latvia–Estonia Guidebook"}
,{id:339,name:"Peasants, Worker and Scientist Mosaic",city:"Babruysk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.153997,lng:29.220496,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"Facade mosaic at 73 Minskaya Street portraying agriculture, industry and science; the work survives in good condition on the north wall.",source:"https://monumental.by/ru/point/krestyanka_rabochiy_i_uchyenyy/",sourceLabel:"Monumental Art · Belarus"}
,{id:340,name:"Partisans Mosaic",city:"Babruysk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.155765,lng:29.217824,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"North-facade mosaic at 89 Minskaya Street depicting Belarusian partisans; the monumental-art catalogue reports it remains accessible and in good condition.",source:"https://monumental.by/ru/point/prtizany/",sourceLabel:"Monumental Art · Belarus"}
,{id:341,name:"Rodina Mosaic",city:"Babruysk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.157312,lng:29.215477,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"Mosaic on the north facade of the residential building at 105 Minskaya Street, celebrating the Belarusian peasant woman; documented as surviving in good condition.",source:"https://monumental.by/ru/point/rodina/",sourceLabel:"Monumental Art · Belarus"}
,{id:342,name:"Decorative Mosaic Wall at Former Rubin Jeweller",city:"Navapolatsk, Belarus",country:"Belarus",cat:"Mosaics",lat:55.5362907,lng:28.6433804,year:"1968",tone:"#ba4937",symbol:"✳",desc:"The city’s oldest surviving monumental artwork, made for the facade of the former Rubin jewellery shop by Nikolai Bryukhanov and Vsevolod Izergin.",source:"https://monumental.by/ru/point/gastsinitsa-belarus/",sourceLabel:"Monumental Art · Belarus"}
,{id:343,name:"Mosaics at the Bobruisk Leather Factory",city:"Babruysk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.175871,lng:29.205091,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"Surviving industrial mosaic work at the leather factory, including a female figure reproduced on the cover of the 1981 journal Rabotnitsa.",source:"https://monumental.by/en/point/mozaika_na_bobruyskom_kozhevennom_kombinate/",sourceLabel:"Monumental Art · Belarus"}
,{id:344,name:"Piiri Missile Base",city:"Muhu Island, Estonia",country:"Estonia",cat:"Lost Places",lat:58.6074,lng:23.1782,year:"1963",tone:"#69766e",symbol:"⌂",desc:"Former Soviet air-defence site with surviving missile hangars, garages, bunkers and command-post ruins. The heritage guide notes the site is on state forest land and reachable by ferry.",source:"https://militaryheritagetourism.info/en/military/sites/view/215",sourceLabel:"Military Heritage Tourism · Estonia"}
,{id:345,name:"Vilask Missile Base",city:"Tinu, Estonia",country:"Estonia",cat:"Lost Places",lat:57.8846,lng:26.2087,year:"1960s–1981",tone:"#69766e",symbol:"⌂",desc:"Former Soviet R-12U strategic missile facility with deep shaft-launch infrastructure. The shafts were filled for safety, but the military landscape remains visible.",source:"https://militaryheritagetourism.info/en/military/sites/view/1204",sourceLabel:"Military Heritage Tourism · Estonia"}
,{id:346,name:"Šateikiai Ground Missile Base",city:"Plungė District, Lithuania",country:"Lithuania",cat:"Lost Places",lat:56.0374,lng:21.6922,year:"1960–1978",tone:"#69766e",symbol:"⌂",desc:"Abandoned Soviet ground-launched R-12 base; six reinforced-concrete hangars and overgrown launch pads remain in the forest. The heritage listing marks it as hard to find.",source:"https://militaryheritagetourism.info/en/military/sites/view/789",sourceLabel:"Military Heritage Tourism · Lithuania"}
,{id:347,name:"Tarvydai (Rumšai) Anti-Aircraft Missile Base",city:"Šilutė District, Lithuania",country:"Lithuania",cat:"Lost Places",lat:55.3302,lng:21.5798,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"Abandoned Soviet S-200 missile division site with surviving barracks, technical-building ruins and traces of launch positions; the heritage guide describes the forest access route.",source:"https://militaryheritagetourism.info/en/military/sites/view/984",sourceLabel:"Military Heritage Tourism · Lithuania"}
,{id:348,name:"Zeltiņi Soviet Army Missile Base",city:"Zeltiņi, Latvia",country:"Latvia",cat:"Lost Places",lat:57.3476,lng:26.7491,year:"1961–1989",tone:"#69766e",symbol:"⌂",desc:"Former top-secret nuclear missile base with surviving hangars, launch pads and shelters. A marked visitor route covers part of the grounds; use the official route and follow local access rules.",source:"https://militaryheritagetourism.info/en/military/sites/view/129",sourceLabel:"Military Heritage Tourism · Latvia"}
,{id:349,name:"Lenin Monument",city:"Ashgabat, Turkmenistan",country:"Turkmenistan",cat:"Monuments",lat:37.93963,lng:58.38461,year:"1927",tone:"#687580",symbol:"⚑",desc:"State-protected monument opened for the 10th anniversary of the October Revolution. Its cube pedestal is clad in majolica with Turkmen carpet patterns; the source also documents its Soviet-era museum history.",source:"https://turkmenportal.com/en/articles/1609",sourceLabel:"Turkmenportal · monument history"}
,{id:350,name:"Magtymguly (Makhtumkuli) Monument",city:"Ashgabat, Turkmenistan",country:"Turkmenistan",cat:"Monuments",lat:37.94497,lng:58.38424,year:"1970",tone:"#687580",symbol:"⚑",desc:"Basalt statue by Minsk sculptor Viktor Popov, designed with Ashgabat architects Vladimir Vysotin and Viktor Kutumov. Turkmenistan’s government describes it as a major work of the country’s Soviet-era monumental art.",source:"https://turkmenistan.gov.tm/index.php/en/post/63348/monument-makhtumkuli-masterpiece-turkmen-monumental-art",sourceLabel:"Turkmenistan Government · monumental art"}
,{id:351,name:"Karl Marx State Library (Bazar Amanov Children’s Library)",city:"Ashgabat, Turkmenistan",country:"Turkmenistan",cat:"Brutalism",lat:37.93639,lng:58.3786,year:"1964–1976",tone:"#a37a51",symbol:"▦",desc:"A Soviet modernist landmark designed by Abdulla Akhmedov, Boris Shpak and Vladimir Alekseyev. It was the Karl Marx State Library and is now the State Children’s Library named after Bazar Amanov; the documented building remains on the former Karl Marx Square. View from public areas and follow any local restrictions.",source:"https://www.sosbrutalism.org/cms/17019081",sourceLabel:"SOSBrutalism · building record"}
,{id:352,name:"Sadriddin Ayni Monument Ensemble",city:"Dushanbe, Tajikistan",country:"Tajikistan",cat:"Monuments",lat:38.5625,lng:68.79889,year:"1978",tone:"#687580",symbol:"⚑",desc:"Bronze monument by Azerbaijani sculptor Omar Eldarov, surrounded by characters from Ayni’s writing. Opened for the centenary of the founder of Tajik Soviet literature; coordinates are published in a Dushanbe monuments guidebook.",source:"https://silkadv.com/en/content/monument-s-aini-dushanbe",sourceLabel:"Dushanbe monuments guidebook · coordinates and history"}
,{id:353,name:"Victory Monument, Dushanbe",city:"Dushanbe, Tajikistan",country:"Tajikistan",cat:"Monuments",lat:38.56278,lng:68.78583,year:"1968",tone:"#687580",symbol:"⚑",desc:"Great Patriotic War memorial by sculptor G. Cherednichenko and architect G. Solominov: two 25-metre reinforced-concrete steles with bas-reliefs. Coordinates mark Victory Square.",source:"https://silkadv.com/en/content/monument-victory-dushanbe",sourceLabel:"Dushanbe monuments guidebook · coordinates and history"}
,{id:354,name:"Ayni and Gorky Monument",city:"Dushanbe, Tajikistan",country:"Tajikistan",cat:"Monuments",lat:38.58361,lng:68.78278,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Sculptural group depicts writers Sadriddin Ayni and Maxim Gorky seated in conversation beside the Tajik Writers’ Union House. The guidebook gives a separate coordinate from the Ayni centenary ensemble.",source:"https://silkadv.com/en/content/monument-s-aini-and-m-gorky-dushanbe",sourceLabel:"Dushanbe monuments guidebook · site description"}
,{id:355,name:"Shorbulak Pamir Observatory",city:"Murghob District, Tajikistan",country:"Tajikistan",cat:"Lost Places",lat:37.93047,lng:74.14267,year:"1970s",tone:"#69766e",symbol:"⌂",desc:"Former Soviet Pamir Astronomical Expedition station at about 4,350 m; the National Academy of Sciences confirms its Soviet origin, and Tajikistan’s tourism authority reports it is currently abandoned. Coordinates are from the site listing; the building is private property and off-road access is remote.",source:"https://traveltajikistan.tj/en/shorbuloq-observatory-murghob-district/",sourceLabel:"Travel to Tajikistan · official tourism site"}
,{id:356,name:"Lenin Statue, Victory Park Khujand",city:"Khujand, Tajikistan",country:"Tajikistan",cat:"Monuments",lat:40.29387,lng:69.603316,year:"1974; relocated 2011",tone:"#687580",symbol:"⚑",desc:"The 22-metre Soviet-era statue was moved from central Khujand to Victory Park in 2011 and remains on a new pedestal. The pin marks its relocated park site, not its former central-square location.",source:"https://www.atlasobscura.com/places/tajikistan-lenin-statue",sourceLabel:"Atlas Obscura · relocation and mapped coordinates"}
,{id:357,name:"Fuzuli Monument, Baku",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Monuments",lat:40.37545,lng:49.83198,year:"1962",tone:"#687580",symbol:"⚑",desc:"Protected bronze monument to poet Muhammad Fuzuli in Fuzuli Square, opposite the National Drama Theatre; officially listed as a monument of national importance.",source:"https://regex.mct.az/az/monview/334/524/Fuzulinin_heykeli",sourceLabel:"Azerbaijan Ministry of Culture · heritage register"}
,{id:358,name:"Khurshidbanu Natavan Monument, Baku",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Monuments",lat:40.36922,lng:49.83727,year:"1960",tone:"#687580",symbol:"⚑",desc:"Bronze monument by sculptor Omar Eldarov, unveiled in 1960 in central Baku; the state register lists the sculpture as a protected memorial monument. Pin checked against the mapped memorial point.",source:"https://culture.gov.az/medias/media/other/13/tma.pdf",sourceLabel:"Azerbaijan Ministry of Culture · heritage register"}
,{id:359,name:"Statue of a Liberated Woman",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Monuments",lat:40.378879,lng:49.831233,year:"1960",tone:"#687580",symbol:"⚑",desc:"Fuad Abdurahmanov’s landmark public sculpture, with architecture by Mikhail Huseynov, is listed by the Culture Ministry as a protected monument dating to the 1960s.",source:"https://regex.mct.az/az/monview/334/5456/Azad_qadin_heykeli",sourceLabel:"Azerbaijan Ministry of Culture · heritage register"}
,{id:360,name:"Uzeyir Hajibeyli Monument, Baku Music Academy",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Monuments",lat:40.37722,lng:49.84444,year:"1960",tone:"#687580",symbol:"⚑",desc:"Bronze, 2.9-metre statue by Tokay Mammadov, erected in front of the Azerbaijan State Conservatory (today Baku Music Academy). The site’s presidential library documents the monument and its placement.",source:"https://uzeyirhajibeyli.preslib.az/en/list/monuments",sourceLabel:"Presidential Library of Azerbaijan · Hajibeyli monuments"}
,{id:361,name:"Jafar Jabbarli Monument",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Monuments",lat:40.37933,lng:49.84792,year:"1982",tone:"#687580",symbol:"⚑",desc:"Pink-granite monument by sculptor Mir-Ali Mir-Gasimov, unveiled on Jafar Jabbarli Square by the railway station; the Culture Ministry register lists it as a protected monument.",source:"https://commons.wikimedia.org/wiki/Category:C%C9%99f%C9%99r_Cabbarl%C4%B1n%C4%B1n_heyk%C9%99li_(Bak%C4%B1)",sourceLabel:"Wikimedia Commons · monument metadata and mapped point"}
,{id:362,name:"Monument to the Unconquered Poltava People",city:"Poltava, Ukraine",country:"Ukraine",cat:"Monuments",lat:49.58831,lng:34.55144,year:"1967",tone:"#687580",symbol:"⚑",desc:"Granite memorial with a bust of underground resistance leader Lyalya Ubyivovk, erected in 1967. The city tourism listing places it at the Kotliarevskyi and Yulian Matviichuk street intersection; pin is approximate to that junction.",source:"https://visitpoltava.com/en/historydata/view?id=37",sourceLabel:"Poltava official tourism portal · history and location"}
,{id:363,name:"Stepan Suprun Monument",city:"Sumy, Ukraine",country:"Ukraine",cat:"Monuments",lat:50.9107,lng:34.7981,year:"1947",tone:"#687580",symbol:"⚑",desc:"Monument to Soviet test pilot and twice Hero of the Soviet Union Stepan Suprun, installed in 1947 and moved to its present square during 1970s redevelopment. Address: 1 Troitska Street; map pin is approximate to the address.",source:"https://uamonuments.sumdu.edu.ua/en/view.php?id_mem=9",sourceLabel:"Catalog of Monuments of Ukraine · Sumy State University"}
,{id:364,name:"Semen Kozak Monument",city:"Korosten, Ukraine",country:"Ukraine",cat:"Monuments",lat:50.9473,lng:28.6381,year:"1949",tone:"#687580",symbol:"⚑",desc:"Monument to twice Hero of the Soviet Union Semen Kozak, installed in 1949 at 8 Hrushevskoho Street. The catalog records that several original insignia were later removed; pin is approximate to the street address.",source:"https://uamonuments.sumdu.edu.ua/en/view.php?id_mem=2042",sourceLabel:"Catalog of Monuments of Ukraine · Sumy State University"}
,{id:365,name:"Universal Tractor Monument, Luhyny",city:"Luhyny, Ukraine",country:"Ukraine",cat:"Monuments",lat:51.075393,lng:28.388807,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Surviving Soviet Universal tractor preserved as a monument to local mechanization workers. The exact point is published by the regional cultural-tourism listing; the site interprets the machine as a landmark of agricultural modernization.",source:"https://discover.ua/en/locations/pamatnik-persomu-traktoru-universal-u-luginah",sourceLabel:"Discover Ukraine · monument description and coordinates"}
,{id:366,name:"Universal Tractor Labour Glory Monument, Reshetylivka",city:"Reshetylivka, Ukraine",country:"Ukraine",cat:"Monuments",lat:49.544231,lng:34.065039,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Locally protected Soviet-era work-glory monument featuring a Universal tractor, on Novoselivska Street. Coordinates and the heritage inventory number are recorded with the geotagged cultural-monument entry.",source:"https://commons.wikimedia.org/wiki/Category:Universal_tractor_in_Reshetylivka",sourceLabel:"Wikimedia Commons · Ukrainian cultural heritage record and map point"}
,{id:367,name:"Universal Tractor Labour Glory Monument, Hrebinka",city:"Hrebinka, Ukraine",country:"Ukraine",cat:"Monuments",lat:50.112586,lng:32.442594,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Locally protected tractor monument honoring agricultural labor, documented on Silskohoospodarska Street 1. The coordinate is from the georeferenced cultural-heritage record and its site photographs.",source:"https://commons.wikimedia.org/wiki/Category:Universal_tractor_in_Hrebinka",sourceLabel:"Wikimedia Commons · Ukrainian cultural heritage record and map point"}
,{id:368,name:"First Tractor Drivers Monument, Kolky",city:"Kolky, Ukraine",country:"Ukraine",cat:"Monuments",lat:51.093464,lng:25.665864,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Locally protected monument honoring the first tractor drivers working in the Volyn fields. The cultural-heritage entry provides an inventory number, photographs and a georeferenced point.",source:"https://commons.wikimedia.org/wiki/Category:Monument_to_the_first_tractor_drivers_in_Volyn_region,_Kolky",sourceLabel:"Wikimedia Commons · Ukrainian cultural heritage record and map point"}
,{id:369,name:"First Tractorists Monument, Radekhiv",city:"Radekhiv, Ukraine",country:"Ukraine",cat:"Monuments",lat:51.160825,lng:24.083669,year:"Soviet period",tone:"#687580",symbol:"⚑",desc:"Locally protected tractor monument commemorating the first tractorists who worked in the Volyn fields. Its georeferenced cultural-heritage record includes the official inventory number and a photo set.",source:"https://commons.wikimedia.org/wiki/Category:Monument-tractor_in_Radekhiv",sourceLabel:"Wikimedia Commons · Ukrainian cultural heritage record and map point"}
,{id:370,name:"Baku State Circus",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Brutalism",lat:40.383042,lng:49.839639,year:"1967",tone:"#a37a51",symbol:"▦",desc:"Soviet-era circus building with a prominent dome, designed by Enver Ismayilov and Faina Leontyeva and opened in 1967. The tourism authority describes its unusual dome and architectural significance; marker follows the mapped building footprint.",source:"https://azerbaijan.travel/fun-for-everyone-at-the-baku-circus",sourceLabel:"Azerbaijan Travel · national tourism authority"}
,{id:371,name:"Former Soviet Military Camp near Türkan",city:"Türkan, Azerbaijan",country:"Azerbaijan",cat:"Lost Places",lat:40.350765,lng:50.273538,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"An environmental and archaeological baseline survey records this as an abandoned, ruined Soviet-era military camp east of Türkan. The survey provides the coordinate; ownership and public access are not documented, so do not enter without permission.",source:"https://www.bp.com/content/dam/bp/country-sites/en_az/azerbaijan/home/pdfs/esias/swap/appx/appendix-5d.pdf",sourceLabel:"BP Environmental and Social Impact Assessment · cultural heritage inventory"}
,{id:372,name:"Gulustan Palace",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Brutalism",lat:40.35859,lng:49.83203,year:"1979–1980",tone:"#a37a51",symbol:"▦",desc:"Modernist state ceremonial and wedding-palace complex set into Baku’s hillside, designed by Hafiz Amirxanov and Nazim Hacibayov. The President’s office confirms its construction in 1979–1980 and later renovation; coordinates are from the mapped building point.",source:"https://president.az/en/articles/view/52275/print",sourceLabel:"President of Azerbaijan · construction date and renovation"}
,{id:373,name:"Memorial to the Victims of Fascism",city:"Chișinău, Moldova",country:"Moldova",cat:"Monuments",lat:47.0427795,lng:28.8447197,year:"1982",tone:"#687580",symbol:"⚑",desc:"Concrete and white Cosăuți-stone composition by sculptor Aurel David, dedicated at a mass execution site. It was restored in 2015; location is listed at Calea Orheiului 19.",source:"https://cultura.chisinau.md/wp-content/uploads/2024/05/Registrul-monumentelor-de-for-public-Categoria-A.pdf",sourceLabel:"Chișinău Culture Directorate · Category A register"}
,{id:374,name:"Boris Glavan Monument",city:"Bălți, Moldova",country:"Moldova",cat:"Monuments",lat:47.7548763,lng:27.922673,year:"1981",tone:"#687580",symbol:"⚑",desc:"Marble bust on a concrete pedestal by sculptor N. Gorenîșev, listed in Moldova’s public-monument register. The municipality confirms its place at the Alecu Russo University complex and commemorative ceremonies there in 2025.",source:"https://balti.md/sase-sculpture-din-mun-balti-sunt-incluse-in-registrul-national-al-monumentelor-de-for-public/",sourceLabel:"Bălți City Hall · public-monument register"}
,{id:375,name:"Alecu Russo Monument",city:"Bălți, Moldova",country:"Moldova",cat:"Monuments",lat:47.7547973,lng:27.9215143,year:"1971",tone:"#687580",symbol:"⚑",desc:"Portrait relief of writer Alecu Russo in hammered copper on a black-granite pedestal, by sculptor I. Cozlov, in the courtyard of Alecu Russo State University.",source:"https://balti.md/wp-content/uploads/2022/06/pk-56-volumul-ii.-memoriu-general-mun.-balti-08.06.2022.pdf",sourceLabel:"Bălți City Hall · municipal heritage inventory"}
,{id:376,name:"T-34 Liberation Tank Monument",city:"Bălți, Moldova",country:"Moldova",cat:"Monuments",lat:47.76093,lng:27.92766,year:"1968",tone:"#687580",symbol:"⚑",desc:"T-34 tank No. 720 commemorates the Soviet forces that captured Bălți in March 1944. The monument was unveiled on 23 February 1968; pin follows the mapped memorial site.",source:"https://www.concretewastelands.com/entry/memorial-t-34-tank-balti",sourceLabel:"Concrete Wastelands · history and mapped location"}
,{id:377,name:"Memorial to Soviet Soldiers, Bălți",city:"Bălți, Moldova",country:"Moldova",cat:"Monuments",lat:47.75955,lng:27.91700,year:"1950s",tone:"#687580",symbol:"⚑",desc:"Municipal heritage register dates this memorial to the 1950s and lists it at Decebal Street 13. City notices confirm the memorial remains in use; pin is approximate to the listed address, now numbered 13A.",source:"https://balti.md/wp-content/uploads/2024/12/cmb-reshenie-9.8-din-18.12.2024-md.pdf",sourceLabel:"Bălți City Hall · local monument register"}
,{id:378,name:"First Swallows Sculpture",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.696475,lng:25.272164,year:"1987",tone:"#687580",symbol:"⚑",desc:"Bronze-and-stone sculpture beside the National Gallery, enlarged from Juozas Mikėnas’s 1964 model. It was presented to Soviet authorities as a tribute to cosmonauts; it is now read as a symbol of Lithuanian freedom.",source:"https://www.govilnius.lt/gv-campaigns-archive-lt/atostogos-vilniuje/atsotogos-vilniuje-renginiai/savarankiskas-pazinimas/japoniskas-vilnius/skulptura-pirmosios-kregzdes",sourceLabel:"Go Vilnius · city tourism guide"}
,{id:379,name:"Kipras Petrauskas Monument",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.6889,lng:25.27929,year:"1974",tone:"#687580",symbol:"⚑",desc:"Bronze statue of the Lithuanian opera singer beside the National Opera and Ballet Theatre, designed by sculptor Gediminas Jokūbonis and architect Aleksandras Lukšas.",source:"https://www.vle.lt/straipsnis/kipras-petrauskas/",sourceLabel:"Visuotinė lietuvių enciklopedija · Lithuanian encyclopedia"}
,{id:380,name:"Adam Mickiewicz Monument",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.682757,lng:25.293197,year:"1984",tone:"#687580",symbol:"⚑",desc:"A 4.5-metre granite monument to the Polish-Lithuanian Romantic poet, by Gediminas Jokūbonis and architect Vytautas Čekanauskas. The location became a public protest site in 1987.",source:"https://www.govilnius.lt/visit-vilnius/places/monument-to-adomas-mickevicius",sourceLabel:"Go Vilnius · city tourism guide"}
,{id:381,name:"Žemaitė Monument",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.688528,lng:25.274179,year:"1971",tone:"#687580",symbol:"⚑",desc:"Sculpture of Lithuanian writer and public figure Žemaitė in the square named for her, created by Petras Aleksandravičius. The point follows the mapped sculpture location.",source:"https://www.govilnius.lt/visit-vilnius/places/monument-to-zemaite",sourceLabel:"Go Vilnius · city tourism guide"}
,{id:382,name:"Barbora Radvilaitė Sculpture",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.67855,lng:25.285239,year:"1982",tone:"#687580",symbol:"⚑",desc:"Bronze decorative sculpture by Vladas Vildžiūnas depicting Grand Duchess Barbora Radvilaitė. Soviet-era authorities allowed it as a decorative work while forbidding the subject’s name; it stands on Vokiečių Street.",source:"https://www.govilnius.lt/visit-vilnius/places/monument-to-barbora-radvilaite",sourceLabel:"Go Vilnius · city tourism guide"}
,{id:383,name:"The Annalist (Pranciškus Skorina Sculpture)",city:"Vilnius, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.679419,lng:25.286715,year:"1973",tone:"#687580",symbol:"⚑",desc:"Granite courtyard sculpture by Vaclovas Krutinis commemorating early printers Pranciškus Skorina and the Mamonič family; located at Stiklių Street 4.",source:"https://www.govilnius.lt/visit-vilnius/places/statue-of-the-annalist",sourceLabel:"Go Vilnius · city tourism guide"}
,{id:384,name:"Grūtas Park Soviet Sculpture Museum",city:"Grūtas, Lithuania",country:"Lithuania",cat:"Monuments",lat:54.022135,lng:24.079810,year:"Opened 2001",tone:"#687580",symbol:"⚑",desc:"Open-air museum exhibiting Soviet-era monuments removed from Lithuanian public spaces after independence. The park presents the sculptures as artifacts of the occupation period; location is the mapped park entrance area.",source:"https://druskininkai.lt/en/leisure/gruto-park/",sourceLabel:"Druskininkai tourism authority · museum overview"}
,{id:385,name:"Šeikiškiai Anti-Aircraft Missile Base",city:"Molėtai District, Lithuania",country:"Lithuania",cat:"Lost Places",lat:55.2186,lng:25.4551,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"Former Soviet air-defence base with six circular missile launch positions, earth embankments and remnants of shelters. Some buildings have been adapted for current use; the heritage guide marks the forest site as hard to find.",source:"https://militaryheritagetourism.info/en/military/sites/view/995",sourceLabel:"Military Heritage Tourism · site record"}
,{id:386,name:"Šiauliai (Zapalskiai) Nuclear Warhead Depot",city:"Zapalskiai, Lithuania",country:"Lithuania",cat:"Lost Places",lat:55.9502,lng:23.4680,year:"1955–1990s",tone:"#69766e",symbol:"⌂",desc:"Former Soviet nuclear arsenal and underground warhead-storage facility linked by a concrete military road to Zokniai airfield. The heritage record notes surviving underground structures; it does not establish public access, so do not enter without permission.",source:"https://militaryheritagetourism.info/en/military/sites/view/1030",sourceLabel:"Military Heritage Tourism · site record"}
,{id:387,name:"Molotov Line Bunker, Raguviškės",city:"Kretinga District, Lithuania",country:"Lithuania",cat:"Lost Places",lat:55.8597,lng:21.3965,year:"1940–1941",tone:"#69766e",symbol:"⌂",desc:"An unfinished concrete fortification from the Soviet-built Molotov defensive line. The heritage route identifies this individual bunker at Raguviškės and marks it visitable; it was never fully equipped before the 1941 German invasion.",source:"https://militaryheritagetourism.info/en/military/sites/view/1150",sourceLabel:"Military Heritage Tourism · site record"}
,{id:388,name:"Riga Diesel Factory Laboratory Building",city:"Riga, Latvia",country:"Latvia",cat:"Brutalism",lat:56.989224,lng:24.122721,year:"1985–1988",tone:"#a37a51",symbol:"▦",desc:"Ten-storey laboratory and administration block designed for Riga Diesel Factory by Viktors Rimša, Eduards Geijers and Leonīds Dorfmans. Built in the late Soviet period, it is included among Latvia’s notable Brutalist structures; the pin marks Ganību dambis 36.",source:"https://www.castle.lv/rimsha/dizel.html",sourceLabel:"Viktors Rimša architecture archive"}
,{id:389,name:"Institute of Agricultural Resources and Economics Building",city:"Riga, Latvia",country:"Latvia",cat:"Brutalism",lat:56.971596,lng:24.174506,year:"1983",tone:"#a37a51",symbol:"▦",desc:"A Soviet-era research institute building on Struktoru Street, completed in 1983 and noted for its stark, heavy concrete expression. The building remains in institutional use; the pin marks the documented address.",source:"https://neighborhood.lv/en/real-estate/architectural-teika-guide-part-2/",sourceLabel:"Neighborhood · Teika architecture guide"}
,{id:390,name:"Rainis Monument, Esplanāde",city:"Riga, Latvia",country:"Latvia",cat:"Monuments",lat:56.9542,lng:24.1131,year:"1965",tone:"#687580",symbol:"⚑",desc:"Granite monument to Latvian poet Rainis, unveiled on his centenary. Sculptors Aivars Gulbis and Laimonis Blumbergs completed the design begun by Kārlis Zemdega; the site became the setting for Riga’s annual Poetry Days.",source:"https://rigaspieminekli.lv/?id=38&lapa=piemineklis&rajons=6&zanrs=1",sourceLabel:"Riga Monuments Agency · monument record"}
,{id:391,name:"Latvian Riflemen Monument",city:"Riga, Latvia",country:"Latvia",cat:"Monuments",lat:56.9468,lng:24.1057,year:"1971",tone:"#687580",symbol:"⚑",desc:"Granite monument unveiled on Latvian Riflemen Square beside the former Red Riflemen Museum, now the Museum of the Occupation. During the Soviet period its interpretation promoted an ideologically narrowed account of the riflemen’s role.",source:"https://militaryheritagetourism.info/en/military/sites/view/484",sourceLabel:"Military Heritage Tourism · Riga Monuments Agency record"}
,{id:392,name:"Krišjānis Barons Monument",city:"Riga, Latvia",country:"Latvia",cat:"Monuments",lat:56.950708,lng:24.118903,year:"1985",tone:"#687580",symbol:"⚑",desc:"Granite monument to folklorist Krišjānis Barons in Vērmanes Garden, unveiled for the 150th anniversary of his birth. Sculptor Lea Davidova-Medene and architect Gunārs Asaris created the work; the location pin follows a geotagged photograph within the garden.",source:"https://www.rigaspieminekli.lv/?id=24&lapa=piemineklis&rajons=6&zanrs=1",sourceLabel:"Riga Monuments Agency · monument record"}
,{id:393,name:"Maarjamäe Memorial Obelisk",city:"Tallinn, Estonia",country:"Estonia",cat:"Monuments",lat:59.4670,lng:24.8170,year:"1960–1975",tone:"#687580",symbol:"⚑",desc:"Soviet-era memorial complex dedicated to those who fell defending the Soviet Union. The 35-metre obelisk was completed in 1960; the ensemble was expanded through 1975. Pin is placed at the obelisk using Tallinn’s geodetic control point.",source:"https://estonianarchitecture.com/project/maarjama%CC%88e-memorial/",sourceLabel:"Estonian Centre for Architecture · memorial record"}
,{id:394,name:"National Library of Estonia",city:"Tallinn, Estonia",country:"Estonia",cat:"Brutalism",lat:59.43028,lng:24.73889,year:"1984–1992",tone:"#a37a51",symbol:"▦",desc:"Monumental late-Soviet library designed by Raine Karp; completed in 1992 as one of Tallinn’s final Soviet megastructures. ERR describes its controversial architectural design as Brutalist. Pin follows the documented Tõnismägi 2 location.",source:"https://news.err.ee/1608095917/national-library-reconstruction-set-to-begin-in-2022",sourceLabel:"ERR · architecture and building history"}
,{id:395,name:"Pirita Olympic Yachting Centre (TOP)",city:"Tallinn, Estonia",country:"Estonia",cat:"Brutalism",lat:59.467095,lng:24.826991,year:"1976–1980",tone:"#a37a51",symbol:"▦",desc:"Late-Soviet Olympic sailing complex in Pirita, completed for the 1980 regatta. Its heavy concrete forms and angular composition are identified as Brutalist; the centre remains an active harbour and redevelopment is subject to heritage restrictions.",source:"https://news.err.ee/1609974504/heritage-conservation-restrictions-set-on-pirita-top-redevelopment",sourceLabel:"ERR · heritage status and redevelopment"}
,{id:396,name:"Bronze Soldier (Defence Forces Cemetery)",city:"Tallinn, Estonia",country:"Estonia",cat:"Monuments",lat:59.42164,lng:24.76547,year:"1947; relocated 2007",tone:"#687580",symbol:"⚑",desc:"Soviet World War II memorial moved from Tõnismägi to Tallinn’s Defence Forces Cemetery in 2007, where it remains on public display. Coordinates mark the current Filtri Road location, not the former central Tallinn site.",source:"https://vm.ee/en/news/bronze-statue-has-been-made-accessible-public",sourceLabel:"Estonian Ministry of Foreign Affairs · current location"}
,{id:397,name:"Mereranna Pool-Room Mosaic",city:"Narva-Jõesuu, Estonia",country:"Estonia",cat:"Mosaics",lat:59.459297,lng:28.034031,year:"1979",tone:"#d0a04c",symbol:"✺",desc:"Wall composition of coloured ceramic tiles and concrete details designed for the pool room by Aet Andresmaa-Tamm and Mare Soovik-Lobjakas. The Soviet resort complex is now mostly empty; the artwork is reported to survive in place, but interior access is not confirmed.",source:"https://2021.muinsuskaitsepaevad.ee/en/exhibitions_post/puhkekodu-mereranna-taiesed/",sourceLabel:"Estonian Heritage Days · artwork documentation"}
,{id:398,name:"Au tööle (Glory to Work) Monument",city:"Kohtla-Järve, Estonia",country:"Estonia",cat:"Monuments",lat:59.40071,lng:27.28229,year:"1967",tone:"#687580",symbol:"⚑",desc:"Dolomite monument by sculptor Olav Männi and architect Udo Ivask, depicting two miners. Unveiled in 1967 across from the city hall in Keskallee Park; the Estonian tourism authority confirms its public park setting.",source:"https://puhkaeestis.ee/et/monument-au-toole",sourceLabel:"Visit Estonia · monument record"}
,{id:399,name:"Kreenholm Strike Centenary Monument",city:"Narva, Estonia",country:"Estonia",cat:"Monuments",lat:59.3603,lng:28.19592,year:"1972",tone:"#687580",symbol:"⚑",desc:"Sculptural memorial to the 1872 Kreenholm textile workers’ strike, installed for its centenary by sculptor Kalju Reitel and architect Boriss Kalakin. It stands in the park by the former manufactory’s pedestrian entrance; the mapped location is the current monument, not the nearby factory mosaic.",source:"https://riigikantselei.ee/sites/default/files/documents/2022-11/Monumentide%20koond%C3%BClevaade_23_11_2022.pdf",sourceLabel:"Estonian Government Office · monument inventory"}
,{id:400,name:"Mustamäe Decorative End-Wall Mosaic Panels",city:"Tallinn, Estonia",country:"Estonia",cat:"Mosaics",lat:59.397373,lng:24.669397,year:"1963",tone:"#d0a04c",symbol:"✺",desc:"Experimental Soviet-era apartment-block mosaics by Valli Lember-Bogatkina and Margareta Fuks, made from coloured rubble and metal. Tallinn’s public-art map records the work on Akadeemia tee; ERR confirms that the last visible panels remain across from the TalTech campus, while most have been covered by insulation.",source:"https://kunstikaart.tallinn.ee/works/108-korterelamute-dekoratiivsed-otsaseinad",sourceLabel:"Tallinn Public Art Map · artwork record"}
,{id:401,name:"Taurus End-Wall Mosaic, Ehitajate tee 17",city:"Tallinn, Estonia",country:"Estonia",cat:"Mosaics",lat:59.398751,lng:24.669874,year:"1963",tone:"#d0a04c",symbol:"✺",desc:"Enn Põldroos’s experimental façade panel depicting Taurus, made from coloured rubble and metal. Tallinn’s public-art record says this is the only surviving panel in the Ehitajate tee 15–21 group; the other three panels have been covered by insulation.",source:"https://kunstikaart.tallinn.ee/works/109-korterelamute-dekoratiivsed-otsaseinad",sourceLabel:"Tallinn Public Art Map · artwork record"}
,{id:402,name:"Viivikonna Abandoned Mining Settlement",city:"Viivikonna, Estonia",country:"Estonia",cat:"Lost Places",lat:59.33888,lng:27.6878,year:"1930s–Soviet period",tone:"#69766e",symbol:"⌂",desc:"Former oil-shale mining settlement with derelict Soviet-era apartment blocks. Demolition has begun and many houses on the main street have already disappeared; it is a living village in transition, not an empty site. Buildings are unsafe and access requires permission.",source:"https://news.err.ee/1610099698/narva-joesuu-begins-demolition-of-local-ghost-town",sourceLabel:"ERR · current condition and demolition"}
,{id:403,name:"Orbita and Unfinished Chyhyryn Nuclear Plant Settlement",city:"Orbita, Cherkasy Oblast, Ukraine",country:"Ukraine",cat:"Lost Places",lat:49.0866558,lng:32.7620888,year:"1980s–1989",tone:"#69766e",symbol:"⌂",desc:"Half-inhabited settlement built for the unfinished Chyhyryn power plant; most planned housing was never completed and several blocks remain abandoned. Orbita is not an empty ghost town: residents still live here. Use public roads only; do not enter occupied, unsafe or restricted buildings.",source:"https://find-way.com.ua/en/regions/cherkasy-region/chyhyryn/city-ghost-orbit-unfinished-chigirinsk-npp",sourceLabel:"Find-way · place history and coordinates"}
,{id:404,name:"Kyiv Crematorium and Memory Park",city:"Kyiv",country:"Ukraine",cat:"Brutalism",lat:50.41518,lng:30.50227,year:"1967–1982",tone:"#a37a51",symbol:"▦",desc:"A landmark late-Soviet ritual complex by Abraham Miletsky, Ada Rybachuk and Volodymyr Melnychenko, combining sculptural concrete halls with the unfinished Wall of Memory. Listed by Kyiv as protected ritual architecture. The crematorium remains an active facility; respect ceremonies and restricted areas.",source:"https://rus.lb.ua/culture/2018/01/12/386862_kiiv_brutalno_i_funktsionalno.html",sourceLabel:"LB.ua · Brutalist architecture and complex history"}
,{id:405,name:"Gosstroy Residential Building",city:"Baku",country:"Azerbaijan",cat:"Brutalism",lat:40.410246,lng:49.804744,year:"1975–1985",tone:"#a37a51",symbol:"▦",desc:"A distinctive 16-storey residential block with a trapezoidal plan and deep loggias, documented in the global SOS Brutalism survey. The building is occupied and its condition has raised conservation concerns; view from public streets only.",source:"https://www.sosbrutalism.org/cms/18861488",sourceLabel:"SOS Brutalism · Global Survey"}
,{id:406,name:"Salut Hotel",city:"Kyiv",country:"Ukraine",cat:"Brutalism",lat:50.44171,lng:30.55039,year:"1976–1984",tone:"#a37a51",symbol:"▦",desc:"A circular, stepped hotel tower designed by Avraam Miletsky with V. Shevchenko and N. Slohotska. Kyiv’s official visitor guide describes it as Soviet futuristic modernism and notes its frequent association with Brutalism. The hotel is operating; respect guest privacy and use public areas only.",source:"https://app.visit.kyiv.ua/en/locations/salut-hotel/",sourceLabel:"Visit Kyiv · architecture and history"}
,{id:407,name:"Jermuk Palace of Culture and Sports (Kurzal)",city:"Jermuk",country:"Armenia",cat:"Lost Places",lat:39.84130,lng:45.66969,year:"1969–1986",tone:"#69766e",symbol:"⌂",desc:"A long-abandoned Soviet resort complex designed by Martin Mikaelyan, with cinema, pools, library and sculptural reliefs. A 2025 report describes the privately owned building as structurally unsafe; do not enter. Pin is approximate to the documented building location by Lake Sarnakhbyur.",source:"https://am.sputniknews.ru/20250302/prizrak-dzhermuka-kak-privatizirovannoe-zdanie-okazalos-beskhoznym-86277058.html",sourceLabel:"Sputnik Armenia · site history and condition"}
,{id:408,name:"Minsk Sports Palace",city:"Minsk",country:"Belarus",cat:"Brutalism",lat:53.91073,lng:27.54975,year:"1963–1966",tone:"#a37a51",symbol:"▦",desc:"An early Belarusian Brutalist landmark designed by Sergey Filimonov and Valentin Malyshev. The Belarusian architecture guide identifies it as Minsk’s first Brutalist building; the arena remains an active public venue.",source:"https://34travel.me/gotobelarus/post/belarusian-modernism-guide",sourceLabel:"34travel · Belarusian modernism and Brutalism guide"}
,{id:409,name:"Mound of Glory Memorial",city:"Smalyavichy District, Minsk Region",country:"Belarus",cat:"Monuments",lat:54.01861,lng:27.89833,year:"1967–1969",tone:"#687580",symbol:"⚑",desc:"A 70-metre memorial mound and sculptural ring commemorating the Soviet Army’s 1944 liberation of Belarus. The state-protected complex opened in 1969 and is publicly accessible.",source:"https://monumental.by/ru/point/memorialnyy_kompleks_kurgan_slavy/",sourceLabel:"Monumental Art Belarus · object record"}
,{id:410,name:"Khatyn National Memorial Complex",city:"Lahoysk District, Minsk Region",country:"Belarus",cat:"Monuments",lat:54.33458,lng:27.94262,year:"1965–1969",tone:"#687580",symbol:"⚑",desc:"A 1969 state memorial built on the site of Khatyn, a Belarusian village whose residents were massacred by Nazi German forces in 1943. The complex commemorates civilian victims of the occupation. Visit as a place of remembrance.",source:"https://www.memorialmuseums.org/memorialmuseum/state-memorial-khatyn?locale=en",sourceLabel:"Memorial Museums · site history"}
,{id:411,name:"Minsk Palace of Children and Youth",city:"Minsk",country:"Belarus",cat:"Brutalism",lat:53.924824,lng:27.543928,year:"1960s",tone:"#a37a51",symbol:"▦",desc:"A monumental youth cultural centre distinguished by massive dolomite-clad forms, a broad stairway and a deep entrance arch. Belarusian architecture coverage highlights it as a notable Brutalist building; it remains an active public institution.",source:"https://34travel.me/gotobelarus/post/belarusian-modernism-guide",sourceLabel:"34travel · Belarusian modernism and Brutalism guide"}
,{id:412,name:"Grodno House of Science and Technology",city:"Grodno",country:"Belarus",cat:"Brutalism",lat:53.696903,lng:23.819827,year:"1984",tone:"#a37a51",symbol:"▦",desc:"A late-Soviet public building completed in 1984, notable for its heavy massing and sculpted concrete surfaces. The Belarusian architecture guide identifies it as one of Grodno’s clearest Brutalist examples; the building continues to host public and educational services.",source:"https://34travel.me/gotobelarus/post/belarusian-modernism-guide",sourceLabel:"34travel · Belarusian modernism and Brutalism guide"}
,{id:413,name:"BelExpo Exhibition Pavilion",city:"Minsk",country:"Belarus",cat:"Brutalism",lat:53.927845,lng:27.521009,year:"Late 1980s",tone:"#a37a51",symbol:"▦",desc:"A striking late-Soviet exhibition hall with a large curved monolithic roof carried by cable structures and an interior free of columns. The Belarusian architecture guide discusses it as an experimental, forceful public building; check current venue arrangements before visiting.",source:"https://34travel.me/gotobelarus/post/belarusian-modernism-guide",sourceLabel:"34travel · Belarusian modernism and Brutalism guide"}
,{id:414,name:"Kadykchan Abandoned Mining Settlement",city:"Kadykchan, Magadan Oblast",country:"Russia",cat:"Lost Places",lat:63.086696,lng:147.042024,year:"1940s–2010",tone:"#69766e",symbol:"⌂",desc:"A Soviet coal-mining settlement built for the nearby power station. Following a fatal mine explosion and loss of heating, residents were resettled; the last person left by 2010. Buildings are unsafe and bears are present. Remote access is seasonal; do not enter structures and check current local conditions before travel.",source:"https://www.sportmaster.ru/media/articles/goroda-prizraki-rossii-gde-nahodyatsya-i-pochemu-ottuda-ushli-lyudi/",sourceLabel:"Sportmaster Media · history, location and access"}
,{id:415,name:"Bechevinka Former Submarine Base Settlement",city:"Bechevinka Bay, Kamchatka Krai",country:"Russia",cat:"Lost Places",lat:53.272569,lng:159.784325,year:"1960s–1996",tone:"#69766e",symbol:"⌂",desc:"A remote Soviet naval settlement established in the 1960s for a submarine base. The garrison left in 1996, leaving residential blocks and public buildings in ruins. Access is by sea or guided local trip; bears are common. Do not enter unstable buildings or any restricted military area.",source:"https://www.sportmaster.ru/media/articles/goroda-prizraki-rossii-gde-nahodyatsya-i-pochemu-ottuda-ushli-lyudi/",sourceLabel:"Sportmaster Media · history, coordinates and access"}
,{id:416,name:"Enilchek Former Mining Settlement",city:"Enilchek, Issyk-Kul Region",country:"Kyrgyzstan",cat:"Lost Places",lat:42.0292406,lng:79.0811379,year:"1980s–1990s",tone:"#69766e",symbol:"⌂",desc:"A former Soviet mining settlement with several abandoned apartment blocks and unfinished buildings; a small village community still lives here. The area lies near the China border and requires a border-zone permit. Confirm current entry rules before travel and do not enter derelict buildings.",source:"https://www.kyrgyzmap.com/ru/place/engilchek-village-ru/",sourceLabel:"KyrgyzMap · place history, map point and access"}
,{id:417,name:"Brest Regional Center for Youth Creativity",city:"Brest",country:"Belarus",cat:"Brutalism",lat:52.090063,lng:23.730265,year:"1987",tone:"#a37a51",symbol:"▦",desc:"A sculptural youth center shaped like a pioneer campfire, set on long concrete ramps beside the river. It opened in 1987 and remains a busy cultural venue. The Russian-language Belarus Brutalism guide documents the design and its public use.",source:"https://34travel.me/gotobelarus/post/brutalism",sourceLabel:"34travel · Belarusian Brutalism guide"}
,{id:418,name:"BNTU 15th Building (The Ship)",city:"Minsk",country:"Belarus",cat:"Brutalism",lat:53.93766,lng:27.66906,year:"1983",tone:"#a37a51",symbol:"▦",desc:"A large ship-like concrete and glass academic building originally planned for the Minsk Architecture and Construction Institute. It was transferred to Belarusian National Technical University and opened in 1983; the distinctive silhouette is still used as a university building.",source:"https://34travel.me/gotobelarus/post/brutalism",sourceLabel:"34travel · Belarusian Brutalism guide"}
,{id:419,name:"Pripyat Hotel, Pinsk",city:"Pinsk",country:"Belarus",cat:"Brutalism",lat:52.1145523,lng:26.1144852,year:"Soviet era",tone:"#a37a51",symbol:"▦",desc:"A Soviet-era hotel distinguished by exposed concrete, triangular French balconies and a strongly functional facade. It remains an operating hotel; check current visitor access and use public areas only.",source:"https://34travel.me/gotobelarus/post/brutalism",sourceLabel:"34travel · Belarusian Brutalism guide"}
,{id:420,name:"Muynak Ship Graveyard",city:"Muynak, Karakalpakstan",country:"Uzbekistan",cat:"Lost Places",lat:43.790139,lng:59.033972,year:"1960s–present",tone:"#69766e",symbol:"⌂",desc:"An open-air museum at the former Soviet-era fishing port, where a dozen rusting boats rest on the exposed seabed of the vanished Aral Sea. The regional tourism authority describes a public observation deck and visitor tours. View the ships from designated public areas and follow local guidance around the fragile seabed.",source:"https://karakalpakstan.travel/media-and-resources/media-and-resources-62/",sourceLabel:"Karakalpakstan Tourism · official regional guide"}
,{id:421,name:"Mekan Palace (Former Party Archive and Political Education House)",city:"Ashgabat",country:"Turkmenistan",cat:"Brutalism",lat:37.94033,lng:58.38602,year:"1971–1974",tone:"#a37a51",symbol:"▦",desc:"Late-Soviet concrete complex by Vadim Klevensky and Dagmara Vysotskaya, originally housing the Party Archive and House of Political Education. The sculptural reliefs on its main facades were created by Ernst Neizvestny and Harlampiy Romanidi; Turkmenistan’s official architectural history identifies it as Mekan Palace today. Map point is the mapped public building at 55 Döwletmämed Azady Street.",source:"https://turkmenistan.gov.tm/en/post/54791/history-ashgabat-age-modernism",sourceLabel:"Turkmenistan Government · Ashgabat modernism"}
,{id:422,name:"Tashkent TV Tower",city:"Tashkent",country:"Uzbekistan",cat:"Brutalism",lat:41.34568,lng:69.28482,year:"1978–1985",tone:"#a37a51",symbol:"▦",desc:"A 375-metre Soviet-era broadcasting and observation tower designed by Nikolai Terziev-Tsarukov, Yuri Semashko and Vladislav Rusanov with engineers Evgeny Morozov and Mikhail Musheyev. It was commissioned in January 1985, is protected as an architectural and urban-planning monument, and remains an operating public attraction with an observation deck.",source:"https://uchtepa.tashkent.uz/en/city/interesting-places/1",sourceLabel:"Tashkent City Administration · TV Tower history"}
,{id:423,name:"Arzni-3 Abandoned Sanatorium",city:"Arzni, Kotayk Province",country:"Armenia",cat:"Lost Places",lat:40.30906,lng:44.59018,year:"1980–1990s",tone:"#69766e",symbol:"⌂",desc:"A 13-storey Soviet resort designed by architect Martyn Mikaelyan and opened in 1984, with a cinema, restaurant, pool and cable-car link. The complex was later abandoned and its interiors heavily stripped. It is privately owned and in severe disrepair; do not enter, and use only lawful public routes. Pin is approximate to the sanatorium site.",source:"https://arm.sputniknews.ru/20250323/arznu-urvakanneric-meky-inchpes-tiv-3-arvoghjaranic-taran-hnaravvorn-u-anhnary-86930352.html",sourceLabel:"Sputnik Armenia · current state and history"}
,{id:424,name:"Fairy-Tale Soviet Pioneer Camp",city:"Near Spitak, Lori Province",country:"Armenia",cat:"Lost Places",lat:40.80473,lng:44.30153,year:"1975–1993",tone:"#69766e",symbol:"⌂",desc:"A forested Soviet pioneer camp opened in 1985 and abandoned in the early 1990s after earthquake damage and the Soviet collapse. Surviving features include a mosaic-covered pool, zodiac mosaic, sculptures and camp buildings. The road is rough and the site may be privately owned; seek permission and do not enter unstable structures.",source:"https://www.armenianexplorer.com/urbexarmenia/abandoned-soviet-pioneer-camp-fairy-tale",sourceLabel:"Armenian Explorer · site history and surviving art"}
,{id:425,name:"Kokkol Mine and Workers’ Settlement",city:"Kokkol Pass, East Kazakhstan Region",country:"Kazakhstan",cat:"Lost Places",lat:49.71510,lng:86.76809,year:"1938–1954",tone:"#69766e",symbol:"⌂",desc:"A remote tungsten and molybdenum mine and workers’ settlement at roughly 3,000 metres, operated until 1954. Kazakhstan’s official tourism portal describes surviving adits, barracks, a community club, forge and processing plant as an open-air museum. The site is remote with no mobile connection; do not enter mine workings and arrange a suitable guided trip.",source:"https://kazakhstan.travel/en/attractions/978",sourceLabel:"Kazakhstan Travel · official site record"}
,{id:426,name:"Young Girl with a Keepsake Mosaic",city:"Kok Tobe, Almaty",country:"Kazakhstan",cat:"Mosaics",lat:43.23306,lng:76.97611,year:"1970; relocated 2020",tone:"#c28a36",symbol:"✳",desc:"A large Soviet-era mosaic by Moldakhmet Kenbaev and Vladimir Tsivchinsky, originally made for the Kazakhstan national souvenir shop and later saved from demolition. It was reinstalled on Kok Tobe in 2020 and is now a prominent public artwork. Pin marks the Kok Tobe park area; confirm the exact panel position on site.",source:"https://collection.almaty.art/ru/entity/PERSON/3916937?index=28",sourceLabel:"Almaty Art Collection · artist and work history"}
,{id:427,name:"Narxoz University Facade Mosaic",city:"Almaty",country:"Kazakhstan",cat:"Mosaics",lat:43.21507,lng:76.87149,year:"Soviet era; restored 2022",tone:"#c28a36",symbol:"✳",desc:"A Soviet-era mosaic on the southeast facade of Narxoz University, by Georgian artist Sebastian Kirakozov. Its date and original title are unknown; it was rebuilt in 2022. The pin marks the university campus, where the facade is publicly visible from the grounds.",source:"https://www.monumentalalmaty.com/narxoz-university---mosaic.html",sourceLabel:"Monumental Almaty · artist, facade and address"}
,{id:428,name:"Bayzhansay Former Mining Settlement",city:"Bayzhansay, Turkistan Region",country:"Kazakhstan",cat:"Lost Places",lat:43.163532,lng:69.912213,year:"1940s–1990s",tone:"#69766e",symbol:"⌂",desc:"A former Soviet lead-zinc mining settlement in the Karatau mountains. Mining and the processing plant ceased after the ore was exhausted and the settlement declined sharply; abandoned houses and mine workings remain, although a small community still lives here. The remote access road is rough and seasonal. Do not enter mine workings or unstable buildings; respect residents and private property.",source:"https://tengrinews.kz/my-country/podzemnoe-ozero-drevnie-razvalinyi-turistyi-edut-samyiy-410979/",sourceLabel:"Tengrinews · settlement history and surviving ruins"}
,{id:429,name:"Russia–Georgia Friendship Monument (Gudauri Panorama)",city:"Georgian Military Highway, near Gudauri",country:"Georgia",cat:"Monuments",lat:42.4920,lng:44.4527,year:"1983",tone:"#687580",symbol:"⚑",desc:"A semicircular concrete-and-stone monument built for the bicentenary of the 1783 Treaty of Georgievsk. Its inner wall carries a monumental tiled mural, and the cantilevered viewing platform overlooks the Devil’s Valley. The site sits beside the highway at high altitude; weather can change quickly.",source:"https://maspindzeli.ge/places/friendship-monument/",sourceLabel:"Maspindzeli · monument history and site description"}
,{id:430,name:"Droshebi Chkara (The Revolution Breaks Out) Memorial",city:"9 April Park, Tbilisi",country:"Georgia",cat:"Monuments",lat:41.6989,lng:44.8017,year:"1988",tone:"#687580",symbol:"⚑",desc:"A late-Soviet memorial composition in 9 April Park, completed in 1988 and popularly associated with Galaktion Tabidze’s poem ‘Droshebi Chkara’. It commemorates the 1917 February Revolution and is distinct from the park’s later 9 April 1989 remembrance sites.",source:"https://travelguide.ge/en/what-to-do/droshebi-chkara/",sourceLabel:"Travel Guide Georgia · memorial history and exact location"}
,{id:431,name:"Cafe Fantasia (The Octopus) Mosaic Pavilion",city:"Batumi Boulevard, Batumi",country:"Georgia",cat:"Mosaics",lat:41.650089,lng:41.6253158,year:"1975; restored 2017–2019",tone:"#c28a36",symbol:"✳",desc:"A sculptural open-air cafe pavilion clad in colorful mosaic, designed by architect Giorgi Chakhava with artist Zurab Kapanadze. The 1975 work is a rare mosaic building-sculpture, protected as cultural heritage and restored to its original appearance in 2019; the cafe is operating again.",source:"https://boulevard.ge/en/activities-and-entertainment/sightseeing/cafe-fantasy-octopus/67",sourceLabel:"Batumi Boulevard Administration · authors, date and restoration"}
,{id:432,name:"Baku State Archives Building",city:"Baku",country:"Azerbaijan",cat:"Brutalism",lat:40.387436,lng:49.808268,year:"1977",tone:"#a37a51",symbol:"▦",desc:"A monumental block-like archive building completed in 1977 by architects Yuzef Kadimov and Shafiqa Zejnalova. Its stacked massing and restrained openings exemplify late-Soviet modernist design. The building houses archival functions and is not a visitor attraction; view from public space only.",source:"https://www.new-east-archive.org/articles/show/11961/eastern-bloc-architecture-eccentric-urban-buildings-part-4",sourceLabel:"New East · architects, 1977 date and building form"}
,{id:433,name:"Former Institute of Communist Party History and Party Archive",city:"Baku",country:"Azerbaijan",cat:"Brutalism",lat:40.415341,lng:49.834852,year:"1980s",tone:"#a37a51",symbol:"▦",desc:"A late-Soviet archive building designed by Shafiqa Zeynalova and Józef Kadymov for the Institute of Communist Party History and its archive. The Azerbaijani National Library’s architectural survey documents the original function, architects and Azadlıq Avenue address; it now houses the Archive of Political Documents. The pin follows the mapped address.",source:"https://azlib.org/media/books/Azerdovletlayihe.pdf",sourceLabel:"Azerbaijani National Library · building history and architects"}
,{id:434,name:"Min-Kush Former Uranium-Industry Settlement",city:"Min-Kush, Naryn Region",country:"Kyrgyzstan",cat:"Lost Places",lat:41.67334,lng:74.45413,year:"1950s–1990s",tone:"#69766e",symbol:"⌂",desc:"A former Soviet industrial settlement shaped by uranium mining, with decaying apartment blocks, empty civic buildings and remnants of the mining economy. The village remains inhabited, so this is a lived-in post-industrial landscape rather than an abandoned ghost town. Stay on public streets, respect residents, and keep away from fenced industrial and tailings areas.",source:"https://visitkyrgyzstan.org/destinations/min-kush/",sourceLabel:"Visit Kyrgyzstan · town history and present community"}
,{id:435,name:"Ak-Tyuz Former Mining Settlement",city:"Ak-Tyuz, Chuy Region",country:"Kyrgyzstan",cat:"Lost Places",lat:42.8793714,lng:76.1333342,year:"1938–1990s",tone:"#69766e",symbol:"⌂",desc:"A Soviet mining and ore-processing settlement founded in 1938. The plant’s decline left visible industrial traces, while Ak-Tyuz remains a village with residents and current economic activity. The map pin marks the village, not an approved route; do not enter mine workings, restricted industrial areas or tailings sites.",source:"https://kyrgyzmap.com/ru/place/ak-tyuz-ru/",sourceLabel:"KyrgyzMap · history, location and access notes"}
,{id:436,name:"Athletes Mosaic",city:"Republican Sports School, Bishkek",country:"Kyrgyzstan",cat:"Mosaics",lat:42.878982,lng:74.670347,year:"1981",tone:"#c28a36",symbol:"✳",desc:"A monumental Soviet-era mosaic listed in Bishkek’s official inventory of historical and cultural monuments. The register gives the title, 1981 date and address at 33 K. Kolbaev Street. The pin follows the mapped school address; the artwork is on an institutional building, so interior access is not assumed.",source:"https://agro.kg/ru/news/25046/",sourceLabel:"Bishkek monument inventory · title, date and address"}
,{id:437,name:"Krasnogorsky Former Uranium Mining Town",city:"Krasnogorsky, Akmola Region",country:"Kazakhstan",cat:"Lost Places",lat:52.24418,lng:66.51307,year:"1964–1990s",tone:"#69766e",symbol:"⌂",desc:"A former closed Soviet mining town founded for workers at a uranium mine. The mine closed around the end of the Soviet period, leaving empty apartment blocks and derelict schools, shops and civic buildings; a small number of residents still live here. The map point marks the settlement, not a mine site. Respect residents and do not enter unstable or occupied buildings.",source:"https://orda.kz/akmolinskaja-pripjat-hroniki-poslednih-20-zhitelej-byvshego-zasekrechennogo-posjolka/",sourceLabel:"Orda.kz · field report on history, ruins and remaining residents"}
,{id:438,name:"Radio and Modernity Mosaic",city:"Kyrgyz State Television and Radio, Bishkek",country:"Kyrgyzstan",cat:"Mosaics",lat:42.879518,lng:74.576825,year:"1966",tone:"#c28a36",symbol:"✳",desc:"A pebble mosaic by artist Alexander Voronin on the facade of the Kyrgyz State Television and Radio building. The surviving 1966 composition celebrates broadcasting and scientific progress. The point marks the institution’s public-facing address; it is a working facility, so access beyond the street is not assumed.",source:"https://24.kg/obschestvo/380848_sovetskie_mozaiki_bishkeka_chto_sohranilos_achto_gorod_uje_poteryal/",sourceLabel:"24.kg · artist, date, location and surviving condition"}
,{id:439,name:"Prosper, Kyrgizia! Mosaic",city:"Yug-2, Bishkek",country:"Kyrgyzstan",cat:"Mosaics",lat:42.858446,lng:74.610133,year:"1985",tone:"#c28a36",symbol:"✳",desc:"A large facade mosaic by Zhyldyzbek Moldakhmatov depicting Kyrgyz women weaving carpets and preparing bread. The 1985 work survives and can be seen from the public street; residents successfully opposed proposals to cover it with advertising. Pin follows the mapped residential address.",source:"https://24.kg/obschestvo/380848_sovetskie_mozaiki_bishkeka_chto_sohranilos_achto_gorod_uje_poteryal/",sourceLabel:"24.kg · author, date, subject and current condition"}
,{id:440,name:"Song Mosaic",city:"P. F. Shubin Music School, Bishkek",country:"Kyrgyzstan",cat:"Mosaics",lat:42.86994,lng:74.60485,year:"1966",tone:"#c28a36",symbol:"✳",desc:"A Soviet-era mosaic listed as “Song” in Bishkek’s cultural-monument inventory, dated 1966 and located at the P. F. Shubin music school, 101 Moskovskaya Street. The map point marks the school building; access is not assumed because this is an active educational institution.",source:"https://agro.kg/ru/news/25046/",sourceLabel:"Bishkek monument inventory · title, date and address"}
,{id:441,name:"The Great Kobzar School Mosaic",city:"School No. 110, Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.303978,lng:69.274050,year:"1969",tone:"#c28a36",symbol:"✳",desc:"A monumental mosaic by Vladimir Kutkin on the pool building of School No. 110, portraying Ukrainian poet Taras Shevchenko with a kobza and figures from his poetry. The 1969 artwork is documented by Tashkent Modernism; the pin follows the school address. This is an active school, so viewing is from public areas only and entry requires permission.",source:"https://www.tashkentmodernism.uz/buildings/mosaic-mural-at-school-no-110",sourceLabel:"Tashkent Modernism · artist, date and artwork description"}
,{id:442,name:"Greetings Bus-Station Mosaic",city:"Bălți Bus Station, Bălți",country:"Moldova",cat:"Mosaics",lat:47.7694,lng:27.9424,year:"1972",tone:"#ba4937",symbol:"✳",desc:"A 1972 mosaic relief on a freestanding concrete slab outside Bălți’s bus station. The composition combines a stylized sun, crescent moon, stars and flowers; the panel remains largely intact, with some tesserae missing. The archival catalogue lists Vladislav Obukh as the artist, while its descriptive text also mentions Ivan Zagoretski, so the attribution remains uncertain.",source:"https://monumentalmodernism.com/entry/mosaic-greetings-bus-station-balti",sourceLabel:"Monumental Modernism · site record and condition"}
,{id:443,name:"Bălți Housing-Block Mosaic Pair",city:"Mihai Eminescu Boulevard, Bălți",country:"Moldova",cat:"Mosaics",lat:47.7641,lng:27.9399,year:"Soviet era",tone:"#ba4937",symbol:"✳",desc:"Two Soviet-era façade mosaics on opposite sides of a Khrushchev-era residential block: one depicts a soldier, and the other a pioneer beside a tree. Both are partly obscured or damaged by later alterations. The pin marks the mapped apartment block, not public access to the residential property.",source:"https://monumentalmodernism.com/entry/mosaic-housing-complex-1-balti",sourceLabel:"Monumental Modernism · building address and artwork documentation"}
,{id:444,name:"No to Nuclear Weapons Mosaic",city:"Chișinău",country:"Moldova",cat:"Mosaics",lat:47.0357,lng:28.8422,year:"Late 1980s (approx.)",tone:"#ba4937",symbol:"✳",desc:"A late-Soviet ceramic-tile panel showing hands breaking a missile, with the Russian inscription “НЕТ!” (“NO!”). The archive places it in the glasnost-era anti-nuclear campaign and describes it as being in excellent condition. Its exact date is uncertain; the point marks the documented façade location.",source:"https://monumentalmodernism.com/entry/mosaic-no-to-nuclear-weapons-chisinau",sourceLabel:"Monumental Modernism · artwork, location and condition"}
,{id:445,name:"Moldova Mosaic, Cahul",city:"Mihai Eminescu Street, Cahul",country:"Moldova",cat:"Mosaics",lat:45.9067,lng:28.1901,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"A Soviet-era façade mosaic on a residential block, depicting a central female figure surrounded by doves and flowers. The panel remains intact and in good condition; Monumental Modernism reports that it has protected cultural-monument status. The pin follows the documented building address.",source:"https://monumentalmodernism.com/entry/mosaic-moldova-cahul",sourceLabel:"Monumental Modernism · site record and protected status"}
,{id:446,name:"Rachmaninoff School Mosaic",city:"Cahul",country:"Moldova",cat:"Mosaics",lat:45.8946,lng:28.1905,year:"1988",tone:"#ba4937",symbol:"✳",desc:"A large façade mosaic at the S. Rachmaninoff Gymnasium-Kindergarten, showing three stylized female figures among geometric and floral motifs. The work is listed as a protected Category B monument and is reported in good condition. The pin marks the school; view from public areas and do not enter without permission.",source:"https://monumentalmodernism.com/entry/mosaic-kindergarten-gymnasium-s-rachmaninoff-cahul",sourceLabel:"Monumental Modernism · protected artwork and address"}
,{id:447,name:"Science, Agriculture and Culture Entrance Mosaic",city:"Tiraspol",country:"Moldova",cat:"Mosaics",lat:46.8360,lng:29.5648,year:"Soviet era",tone:"#ba4937",symbol:"✳",desc:"A large continuous ceramic-tile frieze on a freestanding wall at the entrance to Tiraspol. Its three scenes depict science, agriculture and cultural life. The archive reports a well-maintained surface with little visible weathering; the precise installation date is not recorded.",source:"https://monumentalmodernism.com/entry/mosaic-tiraspol",sourceLabel:"Monumental Modernism · site record, address and condition"}
,{id:448,name:"Mermaid and Merman Bus-Station Mosaic",city:"Former Bus Station, Rîbnița",country:"Moldova",cat:"Mosaics",lat:47.7544,lng:28.9855,year:"Soviet era (approx.)",tone:"#ba4937",symbol:"✳",desc:"A long rooftop mosaic of two merfolk at the former Rîbnița bus station. The archive reports that the panel survived a 2021 renovation and was protected with polyester sheets; its exact date is unknown and current public access is unverified. The pin marks the former station site.",source:"https://monumentalmodernism.com/entry/mosaic-mermaid-and-merman-ribnita",sourceLabel:"Monumental Modernism · artwork and 2021 preservation report"}
,{id:449,name:"Alisher Navoi State Academic Grand Theatre",city:"Tashkent",country:"Uzbekistan",cat:"Monuments",lat:41.30922,lng:69.27152,year:"1940–1947",tone:"#687580",symbol:"⚑",desc:"The landmark opera and ballet theatre was completed in 1947 to Aleksey Shchusev’s design and remains Uzbekistan’s leading opera venue. Its six foyer halls feature distinct regional architectural traditions. The pin marks the theatre at 28 Zarafshan Street; check current performance and visitor arrangements before entering.",source:"https://visit.tashkent.uz/en/attraction/66",sourceLabel:"Visit Tashkent · history and address"}
,{id:451,name:"Mirny Former Uranium-Mining Settlement",city:"Mirny, Zhambyl Region",country:"Kazakhstan",cat:"Lost Places",lat:44.667315,lng:73.854497,year:"1950s–present",tone:"#7c8078",symbol:"⌂",desc:"A Soviet-era settlement established in the late 1950s to support nearby uranium mining. Local reporting describes severe decline, abandoned apartment blocks and public facilities, but the village remains inhabited; this pin marks the settlement, not a mine or ruin. Use public roads only and respect residents and private property.",source:"https://www.youtube.com/watch?v=TPtS9zsyTYk",sourceLabel:"Tengri TV · on-site reporting"}
,{id:452,name:"Iultin Abandoned Mining Settlement",city:"Iultin, Chukotka",country:"Russia",cat:"Lost Places",lat:67.87597,lng:-178.73323,year:"1953–1995",tone:"#69766e",symbol:"⌂",desc:"A remote Soviet tin and tungsten mining town founded in 1953. The mining complex closed in 1994, and the settlement was officially abandoned in 1995. This pin marks the former town; access is remote and seasonal, may require local permits, and entry into unsafe or restricted structures is not advised.",source:"https://www.ier.hit-u.ac.jp/rrc/English/pdf/Kumo2963941SM.pdf",sourceLabel:"Geography, Environment, Sustainability · settlement history"}
,{id:453,name:"Yurshor Former Mining Settlement",city:"Vorkuta, Komi Republic",country:"Russia",cat:"Lost Places",lat:67.61028,lng:64.00194,year:"Abandoned by 2016",tone:"#69766e",symbol:"⌂",desc:"One of the former coal-mining settlements in Vorkuta’s ring, Yurshor is reported abandoned. The pin marks the settlement area; buildings and local routes may be unsafe, so view only from public roads and check local conditions before travel.",source:"https://www.rferl.org/a/russia-vorkuta-coal-mines/27599919.html",sourceLabel:"Radio Free Europe/Radio Liberty · Vorkuta settlements"}
,{id:454,name:"Rudnik Abandoned Settlement",city:"Vorkuta, Komi Republic",country:"Russia",cat:"Lost Places",lat:67.509173,lng:64.021114,year:"1930s–1990s",tone:"#69766e",symbol:"⌂",desc:"The former settlement is an early coal-mining site in Vorkuta, now abandoned. The pedestrian suspension bridge from the city has been reported in dangerous condition; do not cross it. The pin marks Rudnik across the river, not a recommended route or safe access point.",source:"https://tourism.rkomi.ru/travel-guide/mikrorajon-rudnik",sourceLabel:"Komi Republic tourism portal · history and bridge condition"}
,{id:455,name:"Mukhadze Lower Cableway Station Ruins",city:"Chiatura, Imereti",country:"Georgia",cat:"Lost Places",lat:42.28931,lng:43.28809,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"Mapped ruins of the former lower station for Chiatura’s Mukhadze cableway. The historic passenger-ropeway network was built to connect the mining town’s valley with its hillside districts; the modern Mukhadze line now uses a replacement station. View from public areas only; the old structure may be unsafe.",source:"https://wander-lush.org/kutaisi-to-chiatura/",sourceLabel:"Wander-Lush · abandoned station network and current lines"}
,{id:456,name:"Lezhubani Lower Cableway Station Ruins",city:"Chiatura, Imereti",country:"Georgia",cat:"Lost Places",lat:42.2907,lng:43.28239,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"A mapped ruin from Chiatura’s Soviet-era cableway network, near the market and present-day Lezhubani route. The former station is a separate surviving site from the replacement cable car line; the concrete structure is not an authorized entry site and may be unstable.",source:"https://wander-lush.org/kutaisi-to-chiatura/",sourceLabel:"Wander-Lush · abandoned station network and current lines"}
,{id:457,name:"Sunny Fish Mosaic Fountain",city:"Bishkek",country:"Kyrgyzstan",cat:"Mosaics",lat:42.872389,lng:74.611824,year:"1982; mosaic restored 2025",tone:"#ba4937",symbol:"✳",desc:"A playful public fountain designed by artist Vladimir Krugman at the Abdrakhmanov–Toktogul intersection. The city confirms its 1982 construction; restoration work in 2025 uncovered and renewed the original smalt mosaic beneath later concrete. Public-space artwork; check that restoration work has finished before visiting.",source:"https://www.bishkek.gov.kg/ru/post/20591",sourceLabel:"Bishkek City Hall · history and restoration"}
,{id:458,name:"Libani Tuberculosis Sanatorium",city:"Libani, Borjomi Gorge",country:"Georgia",cat:"Lost Places",lat:41.788181,lng:43.456604,year:"1926–1927",tone:"#69766e",symbol:"⌂",desc:"A long tuberculosis sanatorium designed by Mikhail Kalashnikov and built in the Georgian SSR in the late 1920s. It was abandoned after the Soviet period and was reported in poor condition before being designated cultural heritage in 2017. Recent restoration and hotel-development plans have been reported; the building is privately owned, so view only from public areas and do not enter.",source:"https://sputnik-georgia.ru/20170706/Sanatorij-vremen-SSSR-stal-pamjatnikom-kulturnogo-nasledia-Gruzii-236529585.html",sourceLabel:"Sputnik Georgia · history and heritage status"}
,{id:459,name:"Rescued Skazka Store Ceramic Panels",city:"Republican Art College, Dushanbe",country:"Tajikistan",cat:"Mosaics",lat:38.541300,lng:68.763412,year:"Soviet-era panels; relocated by 2021",tone:"#ba4937",symbol:"✳",desc:"Four ceramic panels from the former Skazka children's toy store at Rudaki 66 were salvaged before that building was demolished and installed on the facade of the M. Olimov Republican Art College. The map marks their reported current location, not the lost original building. The college is an active institution; view from public areas and respect access rules.",source:"https://asiaplus.news/2021/10/17/utrachennaya-unikalnost-eshhe-raz-pro-lyubov-k-dushanbinskim-mozaikam-i-vitrazham/",sourceLabel:"Asia-Plus · panels saved and relocated"}
,{id:460,name:"Samarkand Institute Mosaic and Sgraffito",city:"Samarkand",country:"Uzbekistan",cat:"Mosaics",lat:39.653252,lng:66.959397,year:"20th century",tone:"#ba4937",symbol:"✳",desc:"The main building of the Samarkand Institute of Economics and Service carries two protected 20th-century monumental compositions: a mosaic and a sgraffito. Uzbekistan’s national heritage register lists both at Amir Temur Street 9. This is an active university; view from public areas and follow campus access rules.",source:"https://lex.uz/docs/-4543266?ONDATE=16.12.2025",sourceLabel:"Uzbekistan national heritage register · entries 460¹–²"}
,{id:461,name:"Space Mosaic, Shengavit Trolleybus Depot",city:"Yerevan, Armenia",country:"Armenia",cat:"Mosaics",lat:40.142913,lng:44.493736,year:"Soviet era",tone:"#ba4937",symbol:"✳",desc:"A space-themed Soviet mosaic decorates the administrative building of the Shengavit trolleybus depot. The artwork and building are in poor condition; this is an active transport facility, so view only from public areas and do not enter.",source:"https://armmuseum.ru/news-blog/yerevan-mosaics-from-the-matenadaran-to-street-art",sourceLabel:"Armenian Museum of Moscow · mosaic survey"}
,{id:462,name:"Baky Şöhrat (Eternal Glory) Memorial",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.936975,lng:58.313174,year:"2014",tone:"#687580",symbol:"⚑",desc:"A memorial to Turkmen citizens who died in the Great Patriotic War, within the Halk Hakydasy complex. The site is used for official Remembrance Day ceremonies; check local access requirements before visiting.",source:"https://president.az/en/articles/view/30814",sourceLabel:"President of Azerbaijan · visit and wreath-laying at Eternal Glory"}
,{id:463,name:"Budmo Restaurant Mosaic Ensemble",city:"Kyiv",country:"Ukraine",cat:"Mosaics",lat:50.358189,lng:30.472635,year:"1981–1982",tone:"#ba4937",symbol:"✳",desc:"Facade mosaics and mosaic-covered flower sculptures decorate the former Vinnychanka restaurant, opened as a gift from Vinnytsia Oblast for Kyiv’s 1,500th anniversary. The restaurant still operates; the facade can be viewed from public space, while interior works may require customer access.",source:"https://ukrainaincognita.com/mista/mozaiky-holosiivskoho-rayonu-kyieva",sourceLabel:"Ukraine Incognita · Kyiv mosaic survey"}
,{id:464,name:"Ruhy Tagzym Earthquake Memorial",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.936556,lng:58.314304,year:"1998; relocated 2014",tone:"#687580",symbol:"⚑",desc:"A 10-metre bronze bull-and-child composition commemorating victims of the 1948 Ashgabat earthquake. Created in 1998, the monument was moved from central Ashgabat to the Halk Hakydasy memorial complex in 2014. Check local access requirements before visiting.",source:"https://turkmenistan.gov.tm/index.php/en/post/4056/president-of-turkmenistan-attends-the-opening-ceremony-of-the-new-memorial-complex",sourceLabel:"Turkmenistan Government · memorial opening and identity"}
,{id:465,name:"Mollanepes Student Drama Theatre",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.942397,lng:58.389335,year:"1951–1958",tone:"#687580",symbol:"⚑",desc:"A landmark Turkmen drama theatre rebuilt in 1951–1958 to Alexander Tarasenko’s design, now functioning as the Mollanepes Student Drama Theatre. Public performances may be available; check current programming and access before visiting.",source:"https://turkmenistan.gov.tm/en/post/54658/history-ashgabat-tragedy-and-rebirth",sourceLabel:"Turkmenistan Government · post-earthquake architecture"}
,{id:466,name:"Wind Mosaic, Vitryak Restaurant",city:"Kyiv",country:"Ukraine",cat:"Mosaics",lat:50.370556,lng:30.462222,year:"1967",tone:"#ba4937",symbol:"✳",desc:"Monumental exterior mosaic by Alla Horska, Viktor Zaretsky and Boris Plaksiy, created for Anatoly Dobrovolsky’s landmark restaurant. The protected panel was uncovered after being hidden by cladding; recent reports note damage, so check its current condition and view from public space.",source:"https://sovietmosaicsinukraine.org/en/mosaic/71",sourceLabel:"IZOLYATSIA · Soviet Mosaics in Ukraine"}
,{id:467,name:"Ashgabat Railway Station",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.94306,lng:58.39589,year:"1955–1957; rebuilt 2009",tone:"#687580",symbol:"⚑",desc:"The post-earthquake station was designed by Evsey Sorin in Soviet neoclassical style. The railway station remains in service; the current complex was reconstructed in 2009.",source:"https://turkmenistan.gov.tm/en/post/54658/history-ashgabat-tragedy-and-rebirth",sourceLabel:"Turkmenistan Government · post-earthquake architecture"}
,{id:468,name:"Zharsky Brothers Mosaic, Bogkucha Block 1",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.330160,lng:69.221490,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"An orange-toned end-wall mosaic by the Zharsky brothers on a nine-storey residential block in the experimental Bogkucha estate. Restored and visible again in 2025; view from public space.",source:"https://www.tashkent.uz/ru/city/interesting-places/114",sourceLabel:"Tashkent City Administration · Bogkucha history"}
,{id:469,name:"Zharsky Brothers Mosaic, Bogkucha Block 3",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.331047,lng:69.219954,year:"1970s",tone:"#ba4937",symbol:"✳",desc:"One of the restored orange-toned Zharsky brothers mosaics on the end façades of Bogkucha’s nine-storey residential blocks. Reported accessible again in 2025; view from public space.",source:"https://www.tashkent.uz/ru/city/interesting-places/114",sourceLabel:"Tashkent City Administration · Bogkucha history"}
,{id:470,name:"Restored Mosaic Panels, Preschool No. 55",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.287745,lng:69.309390,year:"Soviet era; restored 2026",tone:"#ba4937",symbol:"✳",desc:"Mosaic panels on the grounds of Preschool No. 55 were restored in November 2026 by Uzbekistan’s Cultural Heritage Agency, the Arts and Culture Development Foundation and local activists. The institution is active; view from public space and do not enter without permission.",source:"https://gov.uz/ru/madaniymeros/news/view/249529",sourceLabel:"Uzbekistan Cultural Heritage Agency · restoration notice"}
,{id:471,name:"Zharsky Mosaic, Beruniy Guncha Street",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.3329936,lng:69.2190137,year:"1990",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic mosaic by Nikolay Zharsky on the end wall of an apartment building at Beruniy Guncha Street 1. The city’s mosaic catalogue records the artwork and exact location; view from public space.",source:"https://mosaic.tashkent.uz/en/detail/80",sourceLabel:"Mosaic Tashkent · city mosaic catalogue"}
,{id:472,name:"Zharsky Mosaic, Buyuk Ipak Yuli 1",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.3240056,lng:69.3162068,year:"1985",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic mosaic by Nikolay Zharsky on the end wall of an apartment building at Buyuk Ipak Yuli 1. The city’s mosaic catalogue records the artwork and exact location; view from public space.",source:"https://mosaic.tashkent.uz/en/detail/153",sourceLabel:"Mosaic Tashkent · city mosaic catalogue"}
,{id:473,name:"Turkmen Agricultural University (Former Agricultural Institute)",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.9525479,lng:58.34239125,year:"1952–1955",tone:"#687580",symbol:"⚑",desc:"A post-earthquake Soviet neoclassical academic building, designed for the Agricultural Institute and now used by Turkmen Agricultural University. Turkmenistan’s official history dates the building to 1952–1955. This is an active university campus; follow access rules and view from public areas.",source:"https://turkmenistan.gov.tm/en/post/54658/history-ashgabat-tragedy-and-rebirth",sourceLabel:"Turkmenistan Government · post-earthquake architecture"}
