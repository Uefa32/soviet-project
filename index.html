,{id:474,name:"Saodat Teahouse",city:"Dushanbe",country:"Tajikistan",cat:"Monuments",lat:38.60112,lng:68.78743,year:"1984",tone:"#687580",symbol:"⚑",desc:"A prominent late-Soviet teahouse designed by Bahovaddin Zukhurdinov, combining contemporary planning with Tajik architectural traditions and carved woodwork. It remains an active venue; check current opening and access before visiting.",source:"https://www.pitfi.tj/node/407",sourceLabel:"Tajik Institute of Cultural Research · teahouse heritage"}
,{id:475,name:"State Circus of Tajikistan",city:"Dushanbe",country:"Tajikistan",cat:"Brutalism",lat:38.55778,lng:68.76366,year:"1976–1977",tone:"#a37a51",symbol:"▦",desc:"A Soviet modernist circus with a broad circular roof and repeated structural elements around its façade. The venue remains active and hosts performances; check the current schedule before visiting.",source:"https://ticketon.tj/en/place/gosudarstvennyj-cirk-tadzhikistana-tj",sourceLabel:"Ticketon Tajikistan · venue history and current events"}
,{id:476,name:"Star and Cosmos Mosaic, Chilonzor Block 50",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.274315,lng:69.195753,year:"1966",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic mosaic on the end wall of an apartment block in Chilonzor-17. Tashkent’s municipal mosaic catalogue dates it to 1966 and describes its theme as stars and space; artist attribution remains undetermined. View from public space.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:477,name:"Star and Cosmos Mosaic, Chilonzor Block 51",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.273989,lng:69.196121,year:"1966",tone:"#ba4937",symbol:"✳",desc:"A separate extant ceramic mosaic on the end wall of the neighboring apartment block in Chilonzor-17. The municipal catalogue dates it to 1966 and describes a stars-and-space theme; artist attribution remains undetermined. View from public space.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:478,name:"Ornamental Mosaic, Feruza Block 61",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.359028,lng:69.368661,year:"1969",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic mosaic on an apartment building in Feruza-3. The municipal catalogue records the 1969 work as an ornamental composition and does not identify the artist. View from public space.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:479,name:"Human Figure Mosaic, Mirobod Street 25",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.296757,lng:69.268930,year:"1966",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic wall mosaic by Alfred Mazitov on a building at Mirobod Street 25. The municipal catalogue dates the work to 1966 and identifies a human figure as its theme. View from public space.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:480,name:"Water, People and Air Mosaic",city:"Chingiz Aytmatov Street 1A, Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.327317,lng:69.290238,year:"1970",tone:"#ba4937",symbol:"✳",desc:"An extant ceramic wall mosaic on the building at Chingiz Aytmatov Street 1A. The city catalogue records water, people and air as its themes; its artist is not identified. The building is in active use; view from public space and follow access rules.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:481,name:"Traditions and People Mosaic, Rakatboshi 15",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.300970,lng:69.258536,year:"1970",tone:"#ba4937",symbol:"✳",desc:"An extant smalta mosaic on the facade of the building at Rakatboshi Street 15. Tashkent’s municipal catalogue dates it to 1970 and records traditions and people as its themes; artist Dilmurat Yusupov. View from public space.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:482,name:"Festival and Music Mosaic, Amir Temur Avenue 107",city:"Tashkent",country:"Uzbekistan",cat:"Mosaics",lat:41.342002,lng:69.285333,year:"1970",tone:"#ba4937",symbol:"✳",desc:"An extant mosaic at the building listed at Amir Temur Avenue 107. The city catalogue records themes of festivals, traditions, music and people; the artist attribution and material are not stated here. View from public space and respect venue access rules.",source:"https://mosaic.tashkent.uz/",sourceLabel:"Mosaic Tashkent · municipal catalogue"}
,{id:483,name:"Auska Villa (Former Soviet Leadership Retreat)",city:"Palanga",country:"Lithuania",cat:"Monuments",lat:55.8969,lng:21.0537,year:"1973–1979",tone:"#687580",symbol:"⚑",desc:"A distinctive cross-shaped seaside villa built for senior Soviet officials and kept under KGB security until 1991. The 1970s design and heated swimming pool shaped like Lithuania are documented in Lithuanian architectural and heritage sources. The complex is being redeveloped as a wellness resort while preserving its architectural character; access is private and redevelopment may affect viewing.",source:"https://pastataikalba.lt/palanga/pastatas/vila-auska/",sourceLabel:"Pastatai kalba · history and architectural significance"}
,{id:484,name:"Victory Park Memorial and Heroes’ Alley",city:"Dushanbe",country:"Tajikistan",cat:"Monuments",lat:38.5816,lng:68.81407,year:"Opened 1975; expanded through the 1980s",tone:"#687580",symbol:"⚑",desc:"A Soviet-era Great Patriotic War memorial park on Dushanbe’s hillside, opened in 1975 for the 40th anniversary of Victory and later expanded with an Alley of Heroes honoring 60 Heroes of the Soviet Union. The site remains a public park; use marked paths and check local access conditions.",source:"https://traveltajikistan.tj/en/victory-park/",sourceLabel:"Travel to Tajikistan · memorial history and site description"}
,{id:485,name:"Hara Soviet Submarine Base Ruins",city:"Hara, Harju County",country:"Estonia",cat:"Lost Places",lat:59.58896,lng:25.61225,year:"1950s–1993",tone:"#69766e",symbol:"⌂",desc:"A former Soviet Navy demagnetization station for submarines, built during the occupation and abandoned after Soviet forces left Estonia in 1993. The deteriorating pier and surviving military structures are now interpreted as heritage; entry is ticketed, and climbing on the pier or entering abandoned buildings is forbidden because of collapse hazards.",source:"https://militaryheritagetourism.info/en/military/sites/view/417?lang=en",sourceLabel:"Military Heritage Tourism · history, location and visitor safety"}
,{id:486,name:"Kirovets Pioneer Camp Ruins",city:"Near Zelyonoe, Minsk Region",country:"Belarus",cat:"Lost Places",lat:53.971768,lng:27.314673,year:"Built in the 1960s; closed 2001",tone:"#69766e",symbol:"⌂",desc:"A former pioneer camp belonging to the Kirov machine-tool plant near the Minsk Sea. The surviving timber cabins and camp monuments deteriorated after closure; Belarusian authorities later reported collapsed structures and unsafe conditions. The property has since been sold, so do not enter and seek permission before approaching any part of the site.",source:"https://lovehike.ru/2022/02/12/zabroshennyj-pionerskij-lager-kirovec/",sourceLabel:"LoveHike · site history, condition and field photos"}
,{id:487,name:"Gulistan Covered Market (Russian Bazaar)",city:"Ashgabat",country:"Turkmenistan",cat:"Monuments",lat:37.9416,lng:58.38045,year:"1972–1982",tone:"#687580",symbol:"⚑",desc:"One of Ashgabat’s largest covered markets, designed by architect Vladimir Vysotin as part of the Soviet-era reconstruction of the city. The completed market earned a USSR Council of Ministers award and remains in active use. Visit as a working marketplace and follow local access rules.",source:"https://tif-turkmenistan.com/storage/app/media/travel/accommodation_guide_ru.pdf",sourceLabel:"Turkmenistan Information Centre · design history and dates"}
,{id:488,name:"Turkmen State Circus",city:"Ashgabat",country:"Turkmenistan",cat:"Brutalism",lat:37.95437,lng:58.36631,year:"1979–1984",tone:"#a37a51",symbol:"▦",desc:"Purpose-built Soviet circus designed by Arif Zeynalov, with an expansive unsupported roof and seating for 1,700. The Turkmen government documents its construction from 1979 to 1984; it remains the country’s main circus arena. Check current performance and access arrangements before visiting.",source:"https://turkmenistan.gov.tm/en/post/54791/history-ashgabat-age-modernism",sourceLabel:"Turkmenistan Government · architect and construction dates"}
,{id:489,name:"Domanovo Former Pioneer Camp (Leninets)",city:"Domanovo, Minsk Region",country:"Belarus",cat:"Lost Places",lat:54.252983,lng:27.020578,year:"1980s–2003",tone:"#69766e",symbol:"⌂",desc:"A large children’s recreation center that began in the 1980s as the Leninets pioneer camp. Field documentation reports that its last camp session was in 2003 and shows the site in disrepair; a later image records the abandoned outdoor pool. Current access and condition are uncertain—treat the property as private and do not enter buildings or fenced areas.",source:"https://lovehike.ru/2018/11/19/zabroshki-belarusi-doc-domanovo/",sourceLabel:"LoveHike · history, abandonment and field documentation"}
,{id:490,name:"Dnipro State Circus",city:"Dnipro",country:"Ukraine",cat:"Brutalism",lat:48.46817,lng:35.05374,year:"Opened 1980",tone:"#a37a51",symbol:"▦",desc:"A Soviet modernist circus designed by Pavlo Nirinberg, with a tent-like roof assembled from reinforced-concrete petals and a 2,000-seat arena. The city’s heritage inventory lists the building at Sicheslavska Embankment 33 as a nationally significant monument. It remains an active venue; check current event and access information.",source:"https://gorod.dp.ua/news/112780?co=up",sourceLabel:"Dnipro City Site · architect and opening date"}
,{id:491,name:"National Gallery of Art (Former Lithuanian SSR Revolution Museum)",city:"Vilnius",country:"Lithuania",cat:"Brutalism",lat:54.6967,lng:25.28247,year:"1980",tone:"#a37a51",symbol:"▦",desc:"A Soviet-era museum designed by Gediminas Baravykas and Vytautas Vielius, originally built as the Lithuanian SSR Revolution Museum. Its preserved exterior is recognized as an important example of Lithuanian Soviet modernism; today it houses the National Gallery of Art. The coordinates follow the building-level map point for Konstitucijos Avenue 22.",source:"https://english.lithuanianculture.lt/lithuanian-culture-guide/architecture/2018/06/20/national-art-gallery/",sourceLabel:"Lithuanian Culture Institute · building history"}
,{id:494,name:"Mežgarciems Former Soviet Military Town",city:"Mežgarciems, Latvia",country:"Latvia",cat:"Lost Places",lat:57.1031,lng:24.2356,year:"Postwar Soviet period",tone:"#69766e",symbol:"⌂",desc:"A former Soviet air-defence town and training base near the P1 highway. The military heritage site has information stands and is open to individual visitors; stay within the marked visitor area and follow local guidance.",source:"https://militaryheritagetourism.info/en/military/sites/view/109",sourceLabel:"Military Heritage Tourism · site history and visitor access"}
,{id:495,name:"Liiküla Soviet Border Guard Cordon",city:"Liiküla, Saaremaa, Estonia",country:"Estonia",cat:"Monuments",lat:58.5745,lng:22.4239,year:"Postwar Soviet period",tone:"#687580",symbol:"⚑",desc:"A relatively well-preserved Soviet border-guard complex from the Cold War, including a roughly 22-metre observation tower and a former inn with a photo exhibition. The site is hard to find; follow local access instructions and contact the host before planning a visit.",source:"https://militaryheritagetourism.info/en/military/sites/view/685",sourceLabel:"Military Heritage Tourism · site history and access"}
,{id:496,name:"Sõrve Former Soviet Naval Outpost and Military Museum",city:"Sääre, Saaremaa, Estonia",country:"Estonia",cat:"Monuments",lat:57.9176,lng:22.0581,year:"Barracks built 1955; museum opened 2004",tone:"#687580",symbol:"⚑",desc:"The museum occupies barracks from a former Soviet naval outpost that monitored maritime traffic in the Irbe Strait. Exhibitions cover the Soviet period alongside local military and maritime history. Opening times are limited and a ferry is required to reach the island; check arrangements before travel.",source:"https://militaryheritagetourism.info/en/military/sites/view/205?lang=en",sourceLabel:"Military Heritage Tourism · museum and outpost history"}
,{id:497,name:"Friendship of Peoples Palace (Former Istiqlol Palace)",city:"Tashkent",country:"Uzbekistan",cat:"Brutalism",lat:41.308917,lng:69.241152,year:"1979–1981",tone:"#a37a51",symbol:"▦",desc:"A major concert hall designed by Yevgeny Rozanov and colleagues, combining a monumental concrete structure with Central Asian forms. The Tashkent city administration records its 1981 opening and confirms its historic name was restored in 2018. It remains an active venue; check current events and access.",source:"https://www.sosbrutalism.org/cms/16269681",sourceLabel:"SOS Brutalism · architects and design"}
,{id:498,name:"Alisher Navoi Cinema Palace (Former Palace of Arts)",city:"Tashkent",country:"Uzbekistan",cat:"Brutalism",lat:41.3194,lng:69.259704,year:"1962–1964",tone:"#a37a51",symbol:"▦",desc:"A landmark panoramic cinema designed by Vladimir Berezin, Yuri Khaldeyev, Sergo Sutyagin, Dmitry Shuvayev and Olga Legostaeva. It opened in 1964 and was listed as a historical and cultural monument in 1978; the building remains in cinema and event use. The map point follows the UNESCO nomination map.",source:"https://tashkent.uz/en/city/interesting-places/74",sourceLabel:"Tashkent City Administration · history and heritage listing"}
,{id:499,name:"Turkistan Concert Hall",city:"Tashkent",country:"Uzbekistan",cat:"Brutalism",lat:41.320866,lng:69.26958,year:"Designed 1976–1993; opened 1993",tone:"#a37a51",symbol:"▦",desc:"A concert hall designed by Yuri Khaldeyev, M. Neklyudova, L. Adamov and F. Tursunov. The project began in the Soviet period and opened in 1993; Uzbekistan’s national heritage list records the hall and summer stage as an architectural monument. It remains an active venue at 2 Alisher Navoi Avenue.",source:"https://mirobod.tashkent.uz/en/city/interesting-places/101",sourceLabel:"Tashkent City Administration · history and architects"}
,{id:500,name:"Mayak Restaurant Complex (Former Nautilus Restaurant)",city:"Dnipro",country:"Ukraine",cat:"Lost Places",lat:48.4638982,lng:35.0719321,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"A multi-level restaurant complex on the Dnipro river slope. Its first-floor Nautilus restaurant was created inside the former Neptune bar; the complex is now partly abandoned, with deteriorating and vandalized interiors. View from public areas only and do not enter the building.",source:"https://www.sosbrutalism.org/cms/20259283",sourceLabel:"SOS Brutalism · abandoned Nautilus site"}
,{id:501,name:"Ruhnu Soviet Radar Station",city:"Ruhnu Island",country:"Estonia",cat:"Lost Places",lat:57.8040,lng:23.2241,year:"1964–1992",tone:"#69766e",symbol:"⌂",desc:"Former Soviet air-defence radar post on Ruhnu Island. The military heritage record documents the remaining barracks and radar ruins, as well as contaminated land; do not enter ruins or disturb the site. Island access requires planning.",source:"https://militaryheritagetourism.info/en/military/sites/view/229",sourceLabel:"Military Heritage Tourism · history, remains and coordinates"}
,{id:502,name:"Spitham Soviet Radar Station",city:"Spithami, Lääne-Nigula",country:"Estonia",cat:"Lost Places",lat:59.2225,lng:23.5240,year:"1958–1993",tone:"#69766e",symbol:"⌂",desc:"Former Soviet coastal radar outpost on the Gulf of Finland. Two radar mounds, a command centre, technical bunkers, pillboxes and other ruins remain. The heritage listing indicates individual visits are possible; keep to safe public routes.",source:"https://militaryheritagetourism.info/en/military/sites/view/309",sourceLabel:"Military Heritage Tourism · history, remains and coordinates"}
,{id:503,name:"Türisalu Soviet Anti-Aircraft Missile Base",city:"Türisalu, Harju County",country:"Estonia",cat:"Lost Places",lat:59.4157,lng:24.3240,year:"Soviet era",tone:"#69766e",symbol:"⌂",desc:"Large former Soviet air-defence complex in Tallinn’s air-defence system. Several launch positions, technical and service buildings and a military camp occupied this site; former launch positions remain recognizable in the landscape. Respect land access and do not enter unsafe structures.",source:"https://militaryheritagetourism.info/en/military/sites/view/1184",sourceLabel:"Military Heritage Tourism · site history and coordinates"}
,{id:504,name:"Kohi Borbad Concert Hall",city:"Dushanbe",country:"Tajikistan",cat:"Brutalism",lat:38.5825,lng:68.7622,year:"1984",tone:"#a37a51",symbol:"▦",desc:"A Soviet-era cinema and concert complex designed by a team led by Sergo Sutyagin. Built from monolithic concrete, its low circular hall and sculpted profile are recognised as Brutalist architecture; the venue remains active. Coordinates mark the complex beside Youth Lake.",source:"https://borbad.tj/about",sourceLabel:"Kohi Borbad · official history and design details"}
,{id:505,name:"ACVAPROJECT Tower (Former Moldgiprostroy Institute)",city:"Chișinău",country:"Moldova",cat:"Brutalism",lat:47.0458,lng:28.8626,year:"1980",tone:"#a37a51",symbol:"▦",desc:"A sixteen-storey Soviet-era tower designed by Anatoly Kolotovkin and Tatiana Lomova. Its interlocking volumes and wavy façade are built in monolithic slip-formed concrete. The former institute tower now houses commercial offices; the map point is at Moscova Boulevard 3.",source:"https://www.concretewastelands.com/entry/acvaproject",sourceLabel:"Concrete Wastelands · architects, history and coordinates"}
,{id:506,name:"Plokštinė Former Soviet Missile Garrison",city:"Plokščiai, Plungė District",country:"Lithuania",cat:"Lost Places",lat:56.0263,lng:21.9079,year:"1962–1978",tone:"#69766e",symbol:"⌂",desc:"Former garrison serving the nearby Dvina underground nuclear missile site. Around ten buildings remain from the Soviet military town, including barracks and service structures; visitors can view them from outside and read interpretive panels. The site is managed by Žemaitija National Park, with limited visiting hours and advance arrangements required.",source:"https://militaryheritagetourism.info/en/military/sites/view/785",sourceLabel:"Military Heritage Tourism · history, remains, access and coordinates"},
{id:507,name:"Ristna Soviet Coastal Battery and Radar Station",city:"Ristna, Hiiumaa",country:"Estonia",cat:"Lost Places",lat:58.9276,lng:22.0511,year:"1940–1960s",tone:"#69766e",symbol:"⌂",desc:"A coastal military complex reused by Soviet forces after the Second World War. The site includes 1950s reinforced-concrete gun blocks, a 1953 fire-control tower, underground galleries and ammunition rooms, later radar hills and concrete hangars. Many structures are overgrown; access is by ferry to Hiiumaa and visitors should follow local guidance.",source:"https://militaryheritagetourism.info/en/military/sites/view/501",sourceLabel:"Military Heritage Tourism · site history, remains and coordinates"},
{id:508,name:"Tigran Petrosyan Chess House",city:"Yerevan",country:"Armenia",cat:"Monuments",lat:40.18039,lng:44.524265,year:"1970",tone:"#76808a",symbol:"✦",desc:"A Soviet modernist landmark by Zhanna Meshcheryakova and R. Manukyan, with a triangular plan resembling a chess rook and seven copper chess pieces across its façade. The Armenian capital’s official guide lists it as a historic building and architectural masterpiece; the Chess Federation and sports school still operate here at 50 Khanjyan Street.",source:"https://www.visityerevan.am/places/details/814/en/",sourceLabel:"Visit Yerevan · official city guide, architects and heritage details"},
{id:509,name:"Central Post and Telegraph Office (The Telegraph)",city:"Tbilisi",country:"Georgia",cat:"Brutalism",lat:41.703016,lng:44.793295,year:"1978",tone:"#a37a51",symbol:"▦",desc:"Late-Soviet central post and telegraph building by Lado Alexi-Meskhishvili and Teimuraz Mikashavidze, designed in the Brutalist tradition with a grid-patterned Bolnisi-tuff façade. After decades as a communications landmark, it was restored and adapted as The Telegraph Hotel in 2025; the pin marks 31 Shota Rustaveli Avenue.",source:"https://www.documentjournal.com/2019/03/documenting-the-humanity-in-tbilisis-brutalist-landmark-of-soviet-occupation/",sourceLabel:"Document Journal · building history and architecture"},
{id:510,name:"Kapal-Arasan 500-Bed Sanatorium Complex",city:"Arasan, Jetisu Region",country:"Kazakhstan",cat:"Lost Places",lat:45.27737,lng:79.356328,year:"1977–1982",tone:"#69766e",symbol:"⌂",desc:"The large five-storey Soviet-era treatment complex was built for 500 guests, with a club, dining room, hydropathic facilities and an indoor pool. It is now stripped and abandoned, while the wider historic spa site has private owners and redevelopment plans for 2027. View from public areas only; do not enter the derelict structures.",source:"https://orda.kz/dar-bogov-kotoryj-my-poterjali-kak-v-kazahstane-umiraet-znamenityj-kurort-kapal-arasan-411696/",sourceLabel:"Orda.kz · current condition and Soviet-era complex"},
{id:511,name:"New Maikuduk House of Culture",city:"Karaganda, Kazakhstan",country:"Kazakhstan",cat:"Monuments",lat:49.878169,lng:73.198323,year:"1954",tone:"#687580",symbol:"⚑",desc:"A municipal cultural centre built in 1954, described as one of the last Stalinist Empire-style buildings in Maikuduk. It remains in use as a neighbourhood House of Culture; check local opening times before visiting.",source:"https://welcome.kz/ru/info-cities/karaganda-region/karaganda/must-visit-karaganda",sourceLabel:"Welcome.kz · building date and architectural style"},
{id:512,name:"KazGUgrad Rectorate Tower",city:"Almaty, Kazakhstan",country:"Kazakhstan",cat:"Brutalism",lat:43.22524,lng:76.92172,year:"1971–1980s",tone:"#a37a51",symbol:"▦",desc:"The 17-storey rectorate anchors KazGUgrad, the Soviet-era Al-Farabi University campus planned from 1970 and built in phases. Its projecting sun screens, reinforced-concrete panels and linked campus buildings combine Soviet modernism with Brutalist influences. The university remains active; follow campus access rules.",source:"https://vlast.kz/amp/gorod/19977-stroitelstvo-kazgugrada.html",sourceLabel:"Vlast · campus design and construction history"},
{id:513,name:"Arbob Cultural Palace",city:"Bobojon Ghafurov District, Sughd Region, Tajikistan",country:"Tajikistan",cat:"Monuments",lat:40.26926,lng:69.69240,year:"1951–1957",tone:"#687580",symbol:"⚑",desc:"A Soviet-era palace and landscaped ensemble initiated by kolkhoz chairman Saidkhoja Urunkhodjaev and completed in 1957. The Tajikistan tourism authority says it was added to the state list of historic monuments in 2012. The Mapcarta pin places the palace itself; check visitor access locally.",source:"https://traveltajikistan.tj/en/arbob-cultural-palace-in-bobojon-gafurov-district/",sourceLabel:"Tourism of Tajikistan · official heritage listing"},
{id:514,name:"Khoja Obi Garm Sanatorium",city:"Varzob District, Tajikistan",country:"Tajikistan",cat:"Brutalism",lat:38.8962,lng:68.78471,year:"1965–1983",tone:"#a37a51",symbol:"▦",desc:"A seven-storey mountain sanatorium in the Hissar Range, designed by a team of Dushanbe architects from 1965 and later rebuilt into its distinctive concrete form. The Tajikistan tourism authority describes its Brutalist style and notes the operating spa; confirm booking and access before visiting.",source:"https://ctd.tj/en/2024/12/24/khoja-obi-garm-radioactive-spa-benefits/",sourceLabel:"Tajikistan Tourism Development Committee · architecture and current use"},
{id:515,name:"Vostok-1 Kishchenko Mosaic Ensemble",city:"Minsk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.932905,lng:27.643406,year:"1978–1979",tone:"#ba4937",symbol:"✳",desc:"A four-part monumental mosaic cycle by Alexander Kishchenko across the Vostok-1 residential district. The enormous smalti panels depict Minsk as a city of culture, science, construction and wartime resistance. This pin marks the ensemble area; see the listed addresses for individual façades.",source:"https://34travel.me/gotobelarus/post/10-arhitekturnyh-sekretov-minska",sourceLabel:"34travel · addresses, artist and dates"},
{id:516,name:"October Revolution Mosaic",city:"Kalvariyskaya Street, Minsk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.905053,lng:27.539265,year:"1975",tone:"#ba4937",symbol:"✳",desc:"Alexander Kishchenko’s large façade mosaic depicts the storming of the Winter Palace. The Minsk guide places it on the former food-industry design institute at 1 Kalvariyskaya Street and reports that it is protected as a second-category historic-cultural value.",source:"https://visit-minsk.ru/2026/04/25/sovetskie-mozaiki-minska/",sourceLabel:"Visit Minsk · artwork, address and heritage status"},
{id:517,name:"Partisans Mosaic (Belarus Partisan)",city:"Partizansky Avenue, Minsk, Belarus",country:"Belarus",cat:"Mosaics",lat:53.876113,lng:27.627729,year:"1973",tone:"#ba4937",symbol:"✳",desc:"Alexander Kishchenko’s large-scale mosaic on the facade of Hotel Tourist commemorates Belarusian partisans. A Minsk guide documents its 1973 date and 2013–2015 restoration; the hotel address and coordinates were cross-checked against map listings. View from the public street.",source:"https://visit-minsk.ru/2026/04/25/sovetskie-mozaiki-minska/",sourceLabel:"Visit Minsk · artwork and restoration"},
{id:518,name:"Man and the Elements Mosaic",city:"Visaginas, Lithuania",country:"Lithuania",cat:"Mosaics",lat:55.598854,lng:26.426205,year:"1987–1990",tone:"#ba4937",symbol:"✳",desc:"A 154-square-metre late-Soviet mosaic by Viktor Tatarenko, commissioned by the Ignalina Nuclear Power Plant in 1987 and completed in 1990. Smalti and stainless-steel forms depict humanity’s relationship with the four elements and atomic energy. The documented work remains intact on a residential facade and is visible from public space.",source:"https://easternblog.eu/ru/sights/mosaics-man-and-the-elements-visaginas-lithuania/",sourceLabel:"The Eastern Blog · artist, history and exact coordinates"},
{id:519,name:"Heydar Aliyev Sports Complex Monumental Mosaic",city:"Baku, Azerbaijan",country:"Azerbaijan",cat:"Mosaics",lat:40.39204,lng:49.82502,year:"Soviet era",tone:"#ba4937",symbol:"✳",desc:"A monumental 700-square-metre mosaic on the sports and concert complex, documented by an Azerbaijani researcher as the largest mosaic of the former USSR. The venue remains active; view the facade from public areas and follow venue rules.",source:"https://az.sputniknews.ru/20240528/mozaiki-sssr-v-baku-traditsionnye-tsennosti-ili-perezhitok-proshlogo-464968789.html",sourceLabel:"Sputnik Azerbaijan · researcher interview and artwork scale"},
];
const cats=['All','Lost Places','Monuments','Brutalism','Mosaics'];const colors={'Lost Places':'#69766e','Monuments':'#687580','Brutalism':'#a37a51','Mosaics':'#ba4937'};const categorySymbols={'Lost Places':'⌂','Monuments':'⚑','Brutalism':'▦','Mosaics':'✳'};function categoryIcon(cat){const files={'Lost Places':'lost-places','Monuments':'monuments','Brutalism':'brutalism','Mosaics':'mosaics'};return `<img class="category-icon" src="assets/${files[cat]}.png" alt="" aria-hidden="true" loading="eager">`;}function visitedControl(id){return `<button class="visit-toggle ${visited.has(id)?'visited':''}" aria-label="${visited.has(id)?'Unmark visited':'Mark as visited'}" aria-pressed="${visited.has(id)}" title="Visited" onclick="event.stopPropagation();toggleVisited(${id})"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.2 3 3 6-6"/></svg><span>Visited</span></button>`;}function popupHTML(d){return `<div class="popcat">${d.cat} · ${d.year}</div><div class="poptitle">${d.name}</div><div class="popmeta">${d.city}</div><div class="popdesc">${d.desc}</div>${visitedControl(d.id)}<a class="source-link popsource" href="${d.source}" target="_blank" rel="noopener">Source: ${d.sourceLabel} ↗</a>`;}let active='All',query='',selected=null,selectedCountry='All countries',showVisitedOnly=false;const visitedKey='soviet-project-visited';let visited=new Set();try{visited=new Set(JSON.parse(localStorage.getItem(visitedKey)||'[]').map(Number))}catch(e){}function toggleVisited(id){if(visited.has(id))visited.delete(id);else visited.add(id);try{localStorage.setItem(visitedKey,JSON.stringify([...visited]))}catch(e){}if(window.syncVisitedButton)window.syncVisitedButton();if(window.refreshVisitedUI)window.refreshVisitedUI()}function addVisitedFilter(host){const b=document.createElement('button');b.type='button';b.className='filter visited-filter';b.innerHTML='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 8.2 3 3 6-6"/></svg>Visited';b.setAttribute('aria-pressed','false');b.onclick=()=>{showVisitedOnly=!showVisitedOnly;b.classList.toggle('active',showVisitedOnly);b.setAttribute('aria-pressed',String(showVisitedOnly));if(window.refreshVisitedUI)window.refreshVisitedUI()};host.appendChild(b);window.syncVisitedButton=()=>{b.classList.toggle('active',showVisitedOnly);b.setAttribute('aria-pressed',String(showVisitedOnly))}}const countrySelect=document.getElementById('countrySelect');[...new Set(data.map(d=>d.country))].sort((a,b)=>a.localeCompare(b,'de')).forEach(country=>{const option=document.createElement('option');option.value=country;option.textContent=country;countrySelect.appendChild(option)});
if(!window.L){
  const mapEl=document.getElementById('map');
  mapEl.innerHTML='<div class="fallback-grid"></div><div class="fallback-label">EURASIA</div><div id="fallbackPins"></div><div class="fallback-credit">Offline map view · places are shown schematically</div>';
  const filtersEl=document.getElementById('filters');
  cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.innerHTML=c==='All'?'All':`<i class="dot" style="--c:${colors[c]}"></i><span class="catsymbol" style="--c:${colors[c]}">${categoryIcon(c)}</span>${c}`;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));fallbackRender()};filtersEl.appendChild(b)});addVisitedFilter(filtersEl);
  const leg=document.getElementById('legend');cats.slice(1).forEach(c=>{const s=document.createElement('span');s.innerHTML=`${categoryIcon(c)}${c}`;leg.appendChild(s)});
  function fallbackVisible(d){return(selectedCountry==='All countries'||d.country===selectedCountry)&&(active==='All'||d.cat===active)&&(!showVisitedOnly||visited.has(d.id))&&(!query||`${d.name} ${d.city} ${d.cat}`.toLowerCase().includes(query.toLowerCase()))}
  function fallbackRender(){const shown=data.filter(fallbackVisible);document.getElementById('count').textContent=String(shown.length).padStart(2,'0')+' PLACES';document.getElementById('places').innerHTML=shown.length?shown.map(d=>`<article class="place ${selected===d.id?'selected':''}" data-id="${d.id}"><div class="thumb" style="--tone:${d.tone}">${categoryIcon(d.cat)}</div><div><h3>${d.name}</h3><div class="meta">${d.city}</div><div class="cat">${d.cat} · ${d.year}</div>${visitedControl(d.id)}<a class="source-link" href="${d.source}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Source: ${d.sourceLabel} ↗</a></div><div class="arrow">↗</div></article>`).join(''):'<div class="empty">No matching places found.</div>';document.getElementById('fallbackPins').innerHTML=shown.map(d=>`<button class="fallback-pin ${selected===d.id?'picked':''}" data-id="${d.id}" style="left:${(d.lng-20)/60*100}%;top:${(70-d.lat)/40*100}%;--pin:${colors[d.cat]}" title="${d.name}">${categoryIcon(d.cat)}</button>`).join('');document.querySelectorAll('.place,.fallback-pin').forEach(el=>el.onclick=()=>{selected=Number(el.dataset.id);fallbackRender()})}
  countrySelect.onchange=()=>{selectedCountry=countrySelect.value;fallbackRender()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;fallbackRender()});window.refreshVisitedUI=fallbackRender;fallbackRender();
} else {
let offlineMap=false,tileErrors=0;const map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([48.4,47.4],4);let tiles;L.control.zoom({position:'bottomright'}).addTo(map);
function showOfflineMap(){if(offlineMap)return;offlineMap=true;const layer=document.createElement('div');layer.className='offline-overlay';layer.innerHTML='<div class="fallback-grid"></div><div class="fallback-label">EURASIA</div><div id="offlinePins"></div><div class="fallback-credit">External map tiles blocked · schematic view</div>';document.getElementById('map').appendChild(layer);if(tiles)tiles.off('tileerror');updateOfflinePins();}
const tileSelect=document.getElementById('tileSelect');const savedTile=localStorage.getItem('sovietProject.tile');tileSelect.value=(savedTile==='osmde'||savedTile==='esriimage')?savedTile:'osmde';
function tileTemplate(){if(tileSelect.value==='esriimage')return ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}','Imagery © Esri, Maxar, Earthstar Geographics'];return ['https://tile.openstreetmap.de/{z}/{x}/{y}.png','© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'];}
function applyTiles(){const config=tileTemplate();if(tiles){tiles.off('tileerror');map.removeLayer(tiles)}const old=document.querySelector('.offline-overlay');if(old)old.remove();offlineMap=false;tileErrors=0;localStorage.setItem('sovietProject.tile',tileSelect.value);tiles=L.tileLayer(config[0],{maxZoom:19,attribution:config[1],errorTileUrl:''}).addTo(map);tiles.on('tileerror',()=>{if(++tileErrors>=3)showOfflineMap()});}
tileSelect.onchange=applyTiles;applyTiles();
const markers={}; data.forEach(d=>{const icon=L.divIcon({className:'',html:`<div class="marker" style="background:${colors[d.cat]};border-color:#fff;color:${colors[d.cat]}"><span style="color:white;position:relative;z-index:1">${categoryIcon(d.cat)}</span></div>`,iconSize:[29,29],iconAnchor:[14,14]});const m=L.marker([d.lat,d.lng],{icon}).addTo(map).bindPopup(popupHTML(d));m.on('click',()=>select(d.id,false));markers[d.id]=m;});
const filters=document.getElementById('filters');cats.forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.innerHTML=c==='All'?'All':`<i class="dot" style="--c:${colors[c]}"></i><span class="catsymbol" style="--c:${colors[c]}">${categoryIcon(c)}</span>${c}`;b.onclick=()=>{active=c;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()};filters.appendChild(b)});addVisitedFilter(filters);
const legend=document.getElementById('legend');cats.slice(1).forEach(c=>{const s=document.createElement('span');s.innerHTML=`${categoryIcon(c)}${c}`;legend.appendChild(s)});
function visible(d){return(selectedCountry==='All countries'||d.country===selectedCountry)&&(active==='All'||d.cat===active)&&(!showVisitedOnly||visited.has(d.id))&&(!query||`${d.name} ${d.city} ${d.cat}`.toLowerCase().includes(query.toLowerCase()))}
function updateOfflinePins(){const host=document.getElementById('offlinePins');if(!host)return;host.innerHTML=data.filter(visible).map(d=>`<button class="fallback-pin ${selected===d.id?'picked':''}" data-id="${d.id}" style="left:${(d.lng-20)/60*100}%;top:${(70-d.lat)/40*100}%;--pin:${colors[d.cat]}" title="${d.name}">${categoryIcon(d.cat)}</button>`).join('');host.querySelectorAll('.fallback-pin').forEach(el=>el.onclick=()=>select(Number(el.dataset.id),false))}
function render(){const shown=data.filter(visible);document.getElementById('count').textContent=String(shown.length).padStart(2,'0')+' PLACES';const container=document.getElementById('places');container.innerHTML='';shown.forEach(d=>{const el=document.createElement('article');el.className='place'+(selected===d.id?' selected':'');el.innerHTML=`<div class="thumb" style="--tone:${d.tone}">${categoryIcon(d.cat)}</div><div><h3>${d.name}</h3><div class="meta">${d.city}</div><div class="cat">${d.cat} · ${d.year}</div>${visitedControl(d.id)}<a class="source-link" href="${d.source}" target="_blank" rel="noopener">Source: ${d.sourceLabel} ↗</a></div><div class="arrow">↗</div>`;el.onclick=e=>{if(e.target.closest('a'))return;select(d.id,true)};container.appendChild(el)});if(!shown.length)container.innerHTML='<div class="empty">No matching places found.</div>';data.forEach(d=>{const icon=markers[d.id];const node=icon.getElement();if(node){node.style.display=visible(d)?'':'none';node.querySelector('.marker')?.classList.toggle('visited',visited.has(d.id))}if(icon.isPopupOpen())icon.setPopupContent(popupHTML(d))});if(offlineMap)updateOfflinePins()}
window.refreshVisitedUI=render;
function select(id,fly){selected=id;render();const d=data.find(x=>x.id===id);if(fly&&!offlineMap){map.flyTo([d.lat,d.lng],Math.max(map.getZoom(),7),{duration:.7});markers[id].openPopup()}}
function focusCountry(){if(offlineMap)return;const matches=data.filter(visible);if(selectedCountry==='All countries'){map.flyTo([48.4,47.4],4);return}if(matches.length===1){map.flyTo([matches[0].lat,matches[0].lng],7);return}if(matches.length>1)map.fitBounds(L.latLngBounds(matches.map(d=>[d.lat,d.lng])),{padding:[70,70],maxZoom:7})}
countrySelect.onchange=()=>{selectedCountry=countrySelect.value;selected=null;render();focusCountry()};document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});render();
}
</script>
<script>
(function(){const select=document.getElementById('countrySelect'),host=document.getElementById('countryButtons');if(!select||!host)return;const slugs={'All countries':'all','Armenia':'armenia','Azerbaijan':'azerbaijan','Belarus':'belarus','Estonia':'estonia','Georgia':'georgia','Kazakhstan':'kazakhstan','Kyrgyzstan':'kyrgyzstan','Latvia':'latvia','Lithuania':'lithuania','Moldova':'moldova','Russia':'russia','Tajikistan':'tajikistan','Turkmenistan':'turkmenistan','Ukraine':'ukraine','Uzbekistan':'uzbekistan'};function draw(){host.replaceChildren();Array.from(select.options).forEach(option=>{const button=document.createElement('button');button.type='button';button.className='country-button'+(select.value===option.value?' active':'');button.setAttribute('aria-pressed',String(select.value===option.value));const flag=document.createElement('img');flag.className='country-flag-img';flag.src=`assets/flags/${slugs[option.value]||'all'}.svg`;flag.alt='';flag.setAttribute('aria-hidden','true');const name=document.createElement('span');name.className='country-name';name.textContent=option.textContent;button.append(flag,name);button.onclick=()=>{select.value=option.value;select.dispatchEvent(new Event('change'));draw()};host.appendChild(button)})}select.addEventListener('change',draw);draw()})();
</script>
